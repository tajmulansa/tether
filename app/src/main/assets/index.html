<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Tether</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --acc:hsl(232,90%,72%);
  --acc2:hsl(282,85%,66%);
  --ink:#05060f;
  --line:rgba(255,255,255,.1);
  --line-hi:rgba(255,255,255,.22);
  --surface:rgba(255,255,255,.045);
  --surface-hi:rgba(255,255,255,.09);
  --tx:#f4f6ff;
  --mut:rgba(244,246,255,.54);
  --faint:rgba(244,246,255,.32);
  --gold:#ffd166;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{
  margin:0;height:100%;overflow:hidden;color:var(--tx);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
/* background lives in a CSS layer (composited by the GPU), so the canvas only draws the game */
#bgl{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,var(--b1,#05060f),var(--b2,#10122a))}
#bgl i{position:absolute;border-radius:50%;will-change:transform;animation:drift 38s ease-in-out infinite alternate}
#bgl i:nth-child(1){width:150vw;height:150vw;left:-50vw;top:-20vh;background:radial-gradient(closest-side,var(--g0,rgba(60,60,160,.2)),transparent)}
#bgl i:nth-child(2){width:170vw;height:170vw;left:-10vw;top:25vh;background:radial-gradient(closest-side,var(--g1,rgba(90,40,150,.2)),transparent);animation-duration:51s;animation-delay:-9s}
#bgl i:nth-child(3){width:190vw;height:190vw;left:-70vw;top:60vh;background:radial-gradient(closest-side,var(--g2,rgba(40,80,160,.2)),transparent);animation-duration:64s;animation-delay:-20s}
@keyframes drift{from{transform:translate3d(-6vw,-4vh,0)}to{transform:translate3d(8vw,6vh,0)}}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;padding:0;transition:transform .16s ease,background .2s ease,border-color .2s ease,opacity .2s ease}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
button:active{transform:scale(.96)}
.hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 52%,rgba(2,3,10,.6) 100%)}

/* shared components */
.shard{
  display:inline-block;width:9px;height:9px;border-radius:2px;
  background:linear-gradient(135deg,#fff3b0,#ffb703);transform:rotate(45deg);flex:none;
  box-shadow:0 0 8px rgba(255,209,102,.35);
}
.chip{
  display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:99px;
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  font-weight:500;font-size:13.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.chip b{font-weight:600}

.ibtn{
  width:38px;height:38px;border-radius:19px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--tx);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:auto;
}
.ibtn:hover{background:var(--surface-hi);border-color:var(--line-hi)}

.btn{
  pointer-events:auto;height:54px;border-radius:27px;padding:0 32px;
  font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);width:100%;max-width:260px;
  background:var(--tx);box-shadow:0 14px 36px -8px rgba(0,0,0,.45);
}
.btn:hover{background:#fff}
.btn.ghost{
  height:48px;font-size:13.5px;letter-spacing:.06em;color:var(--tx);
  background:var(--surface);border:1px solid var(--line-hi);box-shadow:none;font-weight:500;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.btn.ghost:hover{background:var(--surface-hi)}
.link{
  pointer-events:auto;color:var(--mut);font-size:13px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;padding:10px 18px;
}
.link:hover{color:var(--tx)}

/* screens */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--st) + 20px) 22px calc(var(--sb) + 20px);
  transition:opacity .35s cubic-bezier(.22,1,.36,1),visibility .35s;
}
#home .top{align-self:stretch;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#home .top > *{pointer-events:auto}

.zone-tag{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--mut);
}
.zone-tag::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 10px var(--acc);
}

.wm{
  margin-top:8vh;display:flex;align-items:center;gap:6px;
  font-size:56px;font-weight:300;letter-spacing:.14em;text-indent:.14em;text-transform:uppercase;
  line-height:1;color:var(--tx);
}
.dotmark{color:var(--acc);overflow:visible;margin-left:2px}
.dotmark .orb{transform-origin:14px 14px;transform-box:view-box;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tag{margin:12px 0 0;color:var(--mut);font-size:14px;font-weight:400;letter-spacing:.03em;text-align:center}

.bestbox{margin-top:32px;text-align:center}
.bestbox b{
  display:block;font-size:44px;font-weight:300;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;
}
.bestbox span{
  display:block;margin-top:6px;color:var(--faint);font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;
}

#home .bottom{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}

.seg{
  display:inline-flex;padding:3px;border-radius:20px;
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto;
}
.seg button{
  height:30px;padding:0 16px;border-radius:17px;font-size:12px;font-weight:500;
  letter-spacing:.04em;color:var(--mut);
}
.seg button.on{background:rgba(255,255,255,.13);color:var(--tx)}
.seg.sm button{height:28px;font-size:12px}

.dock{
  display:flex;width:100%;max-width:340px;justify-content:space-between;
  padding-top:10px;border-top:1px solid var(--line);
}
.dock button{
  pointer-events:auto;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:8px 0;color:var(--mut);font-size:11px;font-weight:500;letter-spacing:.04em;position:relative;
}
.dock button:hover{color:var(--tx)}
.dock button svg{width:20px;height:20px;opacity:.9}
.dock .dot{
  position:absolute;top:6px;left:calc(50% + 7px);width:7px;height:7px;border-radius:4px;
  background:var(--gold);box-shadow:0 0 8px var(--gold);
}

/* HUD */
#hud{
  position:fixed;inset:0;pointer-events:none;
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto 1fr;
  padding:calc(var(--st) + 16px) 20px 20px;transition:opacity .25s;
}
#hud #bPause{justify-self:start;align-self:start}
#hud #hCoins{justify-self:end;align-self:start}
#hMid{text-align:center;min-width:130px}
#hScore{
  font-size:56px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;transition:transform .22s cubic-bezier(.22,1,.36,1);
}
#hScore.pop{transform:scale(1.14)}
#hZone{
  margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mut);
}
#hBar{width:72px;height:2px;border-radius:1px;background:rgba(255,255,255,.12);margin:7px auto 0;overflow:hidden}
#hBarFill{display:block;height:100%;width:0;background:var(--acc);transition:width .28s ease}

#chips{grid-column:1/4;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px;min-height:26px}
.pill{
  height:25px;padding:0 11px;border-radius:13px;display:inline-flex;align-items:center;
  font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.pill.combo{color:var(--acc);border-color:hsla(232,90%,72%,.4)}
.pill.sh{color:hsl(195,95%,76%);border-color:hsla(195,95%,65%,.4)}
.pill.mg{color:hsl(46,100%,74%);border-color:hsla(46,100%,65%,.4)}
.pill.sg{color:hsl(322,95%,80%);border-color:hsla(322,95%,68%,.4)}

#hint{
  grid-column:1/4;align-self:end;justify-self:center;margin-bottom:12vh;
  font-size:13.5px;font-weight:400;letter-spacing:.03em;color:var(--mut);
  padding:10px 20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  animation:breathe 2.2s ease-in-out infinite;transition:opacity .25s;
}
@keyframes breathe{50%{opacity:.45}}

/* over + pause */
#over,#pause{
  justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(6,8,20,.65),rgba(4,5,13,.9));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.ovwrap{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:310px;animation:rise .45s cubic-bezier(.22,1,.36,1) .15s both}
#pause .ovwrap{animation:rise .28s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.ovtag{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.ovtag.gold{color:var(--gold)}

#ovScore{font-size:96px;font-weight:300;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
#ovBest{color:var(--mut);font-size:12.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}

.ovrow{
  display:flex;width:100%;justify-content:space-around;
  padding:14px 0;margin:4px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.ovrow div{text-align:center}
.ovrow b{display:block;font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.ovrow small{display:block;margin-top:3px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}

#ovEarn{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:500;font-size:13px;margin:2px 0 8px}
#bRevive.no{opacity:.4}
.adbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 14px}
.adbtn svg{width:14px;height:14px;flex:none}
.adbtn.hide,#bRevive.hide,#rvTimer.hide{display:none!important}
#rvTimer{width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:2px 0 10px}
#rvTimer i{display:block;height:100%;width:100%;background:var(--gold);border-radius:3px;transform-origin:left center}
#rvTimer.low i{background:#ff5a6a}

/* sheet */
.sbg{position:fixed;inset:0;background:rgba(2,3,8,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .25s,visibility .25s;z-index:6}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;height:min(84%,690px);display:flex;flex-direction:column;z-index:7;
  background:rgba(10,12,26,.9);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;
  padding:20px 20px calc(var(--sb) + 16px);transition:transform .34s cubic-bezier(.22,1,.36,1),opacity .22s,visibility .22s;
}
.sheet.hide{transform:translateY(40px)}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h2{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em;flex:1}
.x{width:34px;height:34px;border-radius:17px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--mut)}
.x:hover{color:var(--tx);border-color:var(--line-hi)}
#shTabs{margin-bottom:14px;display:flex}
#shBody{flex:1;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-bottom:10px}
#shBody::-webkit-scrollbar{width:0;height:0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card-i{border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.025)}
.card-i.eq{border-color:var(--acc);background:rgba(255,255,255,.055)}
.card-i canvas{width:100%;height:auto;border-radius:10px;background:#070917;display:block}
.card-i .nm{font-weight:600;font-size:13.5px;padding:0 2px}

.mini{height:34px;border-radius:17px;padding:0 14px;font-size:12.5px;font-weight:600;background:var(--surface-hi);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.mini.buy{background:var(--tx);color:var(--ink)}
.mini.buy.no{background:var(--surface);color:var(--mut)}
.mini.on{background:transparent;color:var(--acc);border:1px solid var(--acc)}

.note{color:var(--mut);font-size:12.5px;margin:0 2px 12px}
.mis{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:rgba(255,255,255,.025)}
.mis.cl{opacity:.45}
.mis .mt{font-weight:500;font-size:14.5px}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.09);margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--acc)}
.mr{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:12.5px;font-weight:500;min-height:32px}
.rw{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:600}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.025)}
.stat b{display:block;font-size:23px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{color:var(--mut);font-size:12px}

h3{margin:6px 2px 10px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.ach{display:flex;gap:12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
.ach .ic{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line);color:var(--mut);flex:none}
.ach.ok .ic{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.ach .tx{flex:1;min-width:0}
.ach b{display:block;font-size:14px;font-weight:600}
.ach small{color:var(--mut);font-size:12.5px}
.ach .rw{font-size:12.5px}

.row-s{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line);font-weight:500;font-size:14.5px}
.sw{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.12);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:transform .2s cubic-bezier(.22,1,.36,1)}
.sw.on{background:var(--acc)}
.sw.on::after{transform:translateX(20px)}
.danger{margin-top:20px;width:100%;height:44px;border-radius:22px;border:1px solid rgba(255,107,138,.4);color:#ff8fa6;font-weight:600;font-size:13.5px}

#toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 74px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:9}
.toast{
  padding:9px 16px;border-radius:20px;background:rgba(12,14,30,.88);border:1px solid var(--line-hi);
  font-weight:500;font-size:13px;letter-spacing:.02em;animation:toast 2.4s cubic-bezier(.22,1,.36,1) both;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.dotmark .orb,#hint{animation:none}}
/* during play the HUD sits over a moving picture: skip the live blur there (it is re-computed every frame) */
body.playing .chip,body.playing .ibtn,body.playing .pill,body.playing #hint,body.playing .toast{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}
</style>
</head>
<body>
<div id="bgl"><i></i><i></i><i></i></div>
<canvas id="c"></canvas>
<div id="vig"></div>

<div id="hud" class="hide">
  <button id="bPause" class="ibtn" aria-label="Pause"><svg viewBox="0 0 24 24" width="16" height="16"><rect x="7" y="5" width="3" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="3" height="14" rx="1.2" fill="currentColor"/></svg></button>
  <div id="hMid"><div id="hScore">0</div><div id="hZone">Nebula</div><div id="hBar"><i id="hBarFill"></i></div></div>
  <div class="chip" id="hCoins"><i class="shard"></i><b id="hCoinN">0</b></div>
  <div id="chips"></div>
  <div id="hint">Tap to release and catch the next anchor</div>
</div>

<div id="home" class="screen">
  <div class="top">
    <div class="zone-tag" id="homeZone">Nebula</div>
    <div class="chip"><i class="shard"></i><b id="hcN">0</b></div>
  </div>
  <div class="wm"><span>tether</span><svg class="dotmark" viewBox="0 0 28 28" width="26" height="26" aria-hidden="true"><circle cx="14" cy="14" r="10" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.3"/><g class="orb"><circle cx="24" cy="14" r="3.2" fill="currentColor"/></g></svg></div>
  <p class="tag">Swing, let go, catch the next one.</p>
  <div class="bestbox"><b id="hBest">0</b><span id="hBestL">Best score</span></div>
  <div class="bottom">
    <div class="seg" id="modeSeg"><button data-mode="free">Free play</button><button data-mode="daily">Daily challenge</button></div>
    <button class="btn" id="bPlay">Play</button>
    <div class="dock">
      <button data-open="shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 11H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</button>
      <button data-open="missions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>Missions<i class="dot hide" id="mDot"></i></button>
      <button data-open="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Progress</button>
      <button data-open="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
    </div>
  </div>
</div>

<div id="over" class="screen hide">
  <div class="ovwrap">
    <div class="ovtag" id="ovTag">Run over</div>
    <div id="ovScore">0</div>
    <div id="ovBest">Best 0</div>
    <div class="ovrow">
      <div><b id="ovShards">0</b><small>Shards</small></div>
      <div><b id="ovPerf">0</b><small>Perfect</small></div>
      <div><b id="ovCombo">0</b><small>Best combo</small></div>
    </div>
    <div id="ovEarn"></div>
    <button class="btn" id="bRetry">Play again</button>
    <div id="rvTimer" class="hide"><i></i></div>
    <button class="btn ghost adbtn hide" id="bAdRevive"></button>
    <button class="btn ghost" id="bRevive">Revive</button>
    <button class="link" id="bHome">Home</button>
  </div>
</div>

<div id="pause" class="screen hide">
  <div class="ovwrap">
    <div class="ovtag">Paused</div>
    <button class="btn" id="bResume">Resume</button>
    <button class="btn ghost" id="bRestart">Restart</button>
    <button class="link" id="bQuit">Home</button>
  </div>
</div>

<div id="sheetBg" class="sbg hide"></div>
<div id="sheet" class="sheet hide" role="dialog" aria-modal="true">
  <div class="sh-head">

(function(){

const FW=400,FONT='"Plus Jakarta Sans",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif';
let S=1,H=640,offX=0;
let renderScale=1;   /* lowered automatically on slow phones (see governor) */
function resize(){
  let d=Math.max(.7,Math.min(window.devicePixelRatio||1,2)*renderScale);
  /* never push more than ~1.1 million pixels per frame, whatever the screen is */
  d=Math.min(d,Math.sqrt(1100000/Math.max(1,innerWidth*innerHeight)));
  cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);
  S=Math.min(cv.width/FW,cv.height/600);
  H=cv.height/S;
  offX=(cv.width/S-FW)/2;
}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+'m '+(s%60)+'s';}
function resetIn(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);const s=Math.floor((m-n)/1000);return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';}

/* ---------- save data ---------- */

  owned:{trail:['neon'],skin:['pearl']},sel:{trail:'neon',skin:'pearl'},
  stats:{runs:0,latches:0,shards:0,perfects:0,bestCombo:0,time:0,powerups:0},ach:{},
  missions:{day:0,list:[]},set:{sfx:1,music:1,haptic:1,shake:1,guide:1},mode:'free'});
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object')merge(t[k],s[k]);else t[k]=s[k];}}
function loadSave(){const d=DEF();try{const r=JSON.parse(localStorage.getItem('tether_v2')||'null');if(r)merge(d,r);}catch(e){}return d;}

/* ---------- content tables ---------- */
const ZONES=[{n:'Nebula',h:232},{n:'Aurora',h:162},{n:'Sunset',h:16},{n:'Orchid',h:305},{n:'Glacier',h:196}];
const TRAILS=[{id:'neon',n:'Neon',p:0},{id:'fire',n:'Inferno',p:150},{id:'rainbow',n:'Prism',p:400},{id:'stardust',n:'Stardust',p:700},{id:'plasma',n:'Plasma',p:1100}];
const SKINS=[{id:'pearl',n:'Pearl',p:0},{id:'ember',n:'Ember',p:200},{id:'halo',n:'Halo',p:450},{id:'gem',n:'Gem',p:700},{id:'eclipse',n:'Eclipse',p:1000}];
const PU={shield:{h:195,t:'Shield'},magnet:{h:46,t:'Magnet'},surge:{h:322,t:'Double score'}};
const REVIVE=100;

  {id:'score',max:1,vals:[12,22,35],txt:n=>'Score '+n+' in one run'},

const ACH=[

/* ---------- haptics, toast ---------- */
function vib(p){if(save.set.haptic&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
function toast(t){
  const box=$('toasts');while(box.children.length>2)box.removeChild(box.firstChild);

  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},2450);

/* ---------- audio ---------- */
/* Procedural sound: every effect and the music are synthesized in code (no asset files).
   Graph: sfx/music buses -> master -> compressor -> output, with one shared reverb and one shared echo.
   Kept deliberately light: short mono reverb, shared send buses, few nodes per sound, rate-limited rapid sounds. */
let AC=null,master=null,outN=null,SB=null,wetBus=null,MB=null,MG=null,padBus=null,mFilter=null,verbSend=null,delaySend=null,mVerb=null,mEcho=null,noiseBuf=null;
let aVoices=0,mTimer=null,mNext=0,mStep=0,mOn=false,mZone=0,mSlow=0,lastShardT=0;
const BPM=96,STEP=60/BPM/4,MUSIC_VOL=.7;
/* One key and chord loop per zone. pent = the scale used for melodies and for the SFX pitches,
   so sound effects always sit in the same key as the music. */
const MZ=[
  {root:45,pent:[0,3,5,7,10],prog:[[0,'m7'],[-4,'M7'],[3,'M7'],[-2,'M']]},   /* Nebula  A minor */
  {root:50,pent:[0,2,4,7,9], prog:[[0,'M7'],[7,'M'],[9,'m7'],[5,'M7']]},     /* Aurora  D major */
  {root:41,pent:[0,2,4,7,9], prog:[[0,'M7'],[4,'m7'],[5,'M7'],[7,'M']]},     /* Sunset  F major */
  {root:46,pent:[0,3,5,7,10],prog:[[0,'m7'],[-4,'M7'],[-2,'M'],[3,'M7']]},   /* Orchid  Bb minor */
  {root:48,pent:[0,2,4,7,9], prog:[[0,'M7'],[2,'M'],[-3,'m7'],[7,'M']]}      /* Glacier C major */
];
const CHORD={m7:[0,3,7,10],M7:[0,4,7,11],M:[0,4,7,12]};
function mtof(m){return 440*Math.pow(2,(m-69)/12);}

function makeCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{return new C({latencyHint:'interactive'});}catch(e){}
  try{return new C();}catch(e){return null;}
}
function initAudio(){
  if(!AC){AC=makeCtx();if(AC)buildAudio();}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC)startMusic();
}
function buildAudio(){
  const c=AC;
  master=c.createGain();master.gain.value=.9;
  outN=c.createDynamicsCompressor();
  outN.threshold.value=-16;outN.knee.value=20;outN.ratio.value=4;outN.attack.value=.004;outN.release.value=.18;
  master.connect(outN);outN.connect(c.destination);
  /* reverb: short mono impulse response (cheap to run) */
  const len=Math.floor(c.sampleRate*1.1),ir=c.createBuffer(1,len,c.sampleRate),d=ir.getChannelData(0);
  for(let i=0;i<len;i++){const x=1-i/len;d[i]=(Math.random()*2-1)*x*x*Math.sqrt(x);}   /* decay shape x^2.5, cheap to generate */
  const conv=c.createConvolver();conv.buffer=ir;
  verbSend=c.createGain();
  const vlp=c.createBiquadFilter();vlp.type='lowpass';vlp.frequency.value=3800;
  const vOut=c.createGain();vOut.gain.value=.4;
  verbSend.connect(vlp);vlp.connect(conv);conv.connect(vOut);vOut.connect(master);
  /* echo: dotted eighth note, darker on every repeat */
  const dl=c.createDelay(1.5);dl.delayTime.value=STEP*3;
  const fb=c.createGain();fb.gain.value=.36;
  const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2400;
  const dOut=c.createGain();dOut.gain.value=.5;
  delaySend=c.createGain();
  delaySend.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(dOut);dOut.connect(master);
  /* sfx buses: SB = dry, wetBus = dry + reverb */
  SB=c.createGain();SB.gain.value=1;SB.connect(master);
  wetBus=c.createGain();wetBus.connect(master);
  const wv=c.createGain();wv.gain.value=.45;wetBus.connect(wv);wv.connect(verbSend);
  /* music buses */
  MG=c.createGain();MG.gain.value=0;MG.connect(master);            /* music on/off fade */
  mFilter=c.createBiquadFilter();mFilter.type='lowpass';mFilter.frequency.value=2600;mFilter.Q.value=.5;mFilter.connect(MG);
  MB=c.createGain();MB.gain.value=1;MB.connect(mFilter);            /* music level by game state */
  padBus=c.createGain();padBus.gain.value=1;padBus.connect(MB);    /* ducked by the kick (sidechain feel) */
  mVerb=c.createGain();mVerb.gain.value=0;mVerb.connect(verbSend); /* music reverb / echo sends (shared) */
  mEcho=c.createGain();mEcho.gain.value=0;mEcho.connect(delaySend);
  noiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  /* warm-up: push an inaudible blip through the reverb and echo now, so the first real sound does not pay their start-up cost */
  const wb=c.createBuffer(1,256,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<256;i++)wd[i]=(Math.random()*2-1)*1e-5;
  const ws=c.createBufferSource();ws.buffer=wb;ws.connect(verbSend);ws.connect(delaySend);ws.start();
}

/* ----- voice helpers ----- */
function route(out,o){
  if(o.bus){
    out.connect(o.bus);
    if(o.verb)out.connect(mVerb);
    if(o.dly)out.connect(mEcho);
  } else out.connect(o.verb?wetBus:SB);
}
function voice(type,f,t,dur,peak,o){
  o=o||{};
  if(!AC||aVoices>(o.bus?28:40))return;   /* music notes give way before sound effects do */
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.glide||dur));
  if(o.det)osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);
  let out=g;
  if(o.lp){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(o.lp,t);
    if(o.lpTo)lp.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur);g.connect(lp);out=lp;}
  route(out,o);
  aVoices++;osc.onended=function(){aVoices--;try{out.disconnect();}catch(e){}};
  osc.start(t);osc.stop(t+dur+.05);
}
function noise(t,dur,peak,o){
  o=o||{};
  if(!AC||aVoices>(o.bus?28:40))return;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter(),g=AC.createGain();
  f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f0||1000,t);
  if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);route(g,o);
  aVoices++;s.onended=function(){aVoices--;try{g.disconnect();}catch(e){}};
  s.start(t,Math.random()*.4);s.stop(t+dur+.05);
}
function curZone(){return (mOn&&AC)?mZone:((typeof run!=='undefined'&&run&&run.zone)||0)%MZ.length;}
/* pitch from the current key's pentatonic scale; i can be any whole number (wraps up through octaves) */
function zNote(i,zIdx){
  const z=MZ[(zIdx===undefined?curZone():zIdx)%MZ.length],p=z.pent,n=p.length;
  return z.root+24+p[((i%n)+n)%n]+12*Math.floor(i/n);
}
function bell(m,t,vol,dur){
  const f=mtof(m);
  voice('sine',f,t,dur,vol*1.15,{a:.002,verb:.5});
  voice('sine',f*2.76,t,dur*.3,vol*.3,{a:.002,verb:.4});
}
function sfxOk(){return !!(AC&&save.set.sfx&&AC.state==='running');}
function T(){return AC.currentTime+.005;}

/* ----- sound effects ----- */
const sfx={
  tick(){if(!sfxOk())return;voice('sine',1700,T(),.04,.05,{a:.001,to:1100});},
  swoosh(up){if(!sfxOk())return;const t=T();noise(t,.2,.05,{f0:up?600:2400,f1:up?2400:600,q:1,a:.03,verb:.2});},
  start(){if(!sfxOk())return;const t=T();noise(t,.35,.09,{f0:300,f1:3500,q:.9,a:.15,verb:.4});bell(zNote(0),t+.12,.16,.9);bell(zNote(2),t+.19,.14,1);},
  pause(){if(!sfxOk())return;noise(T(),.3,.07,{f0:2500,f1:300,q:.8,a:.02,verb:.2});},
  resume(){if(!sfxOk())return;noise(T(),.3,.07,{f0:300,f1:2500,q:.8,a:.02,verb:.2});},
  release(){
    if(!sfxOk())return;const t=T();
    noise(t,.28,.13,{f0:500,f1:3400,q:1.2,a:.03,verb:.3});
    voice('sine',240,t,.2,.1,{to:640,a:.01});
  },
  latch(combo){
    if(!sfxOk())return;const t=T(),i=Math.min(combo,10);
    bell(zNote(i),t,.2,.75);
    if(combo>=2)bell(zNote(i+5),t+.045,.1,.55);
    voice('sine',175,t,.14,.26,{to:62,a:.002});
  },
  latchSoft(){if(!sfxOk())return;voice('sine',300,T(),.09,.1,{to:200,a:.002});},
  perfect(){
    if(!sfxOk())return;const t=T();
    bell(zNote(5),t,.15,.8);bell(zNote(7),t+.07,.15,.9);bell(zNote(10),t+.14,.13,1.1);
    noise(t,.35,.05,{type:'highpass',f0:6500,a:.02,verb:.5});
  },
  shard(s){
    if(!sfxOk())return;const t=T();
    if(t-lastShardT<.045)return;lastShardT=t;   /* collecting a cluster of shards: skip sounds that would overlap */
    const f=mtof(zNote(Math.min(s,9)+5));
    voice('sine',f,t,.16,.12,{a:.002,verb:.35});
    voice('triangle',f*2,t,.08,.04,{a:.001});
  },
  power(type){
    if(!sfxOk())return;const t=T();
    if(type==='shield'){
      [0,2,4,7].forEach((d,k)=>bell(zNote(d),t+k*.06,.13,.9));
      noise(t,.5,.06,{f0:800,f1:5000,q:.8,a:.15,verb:.5});
    } else if(type==='magnet'){
      voice('sawtooth',220,t,.5,.07,{to:880,a:.02,lp:1500,lpTo:4000,verb:.3});
      [0,2,4].forEach((d,k)=>bell(zNote(d+5),t+.15+k*.07,.1,.7));
    } else {
      for(let k=0;k<5;k++)bell(zNote(k+3),t+k*.05,.11,.6);
      voice('triangle',mtof(zNote(5)),t+.25,.5,.08,{verb:.5});
    }
  },
  zone(){
    if(!sfxOk())return;const t=T();
    voice('sine',300,t,.6,.12,{to:1200,a:.2,verb:.4});
    noise(t,.7,.09,{f0:300,f1:6000,q:.7,a:.5,verb:.6});
    [0,2,4,5,7].forEach((d,k)=>bell(zNote(d,run.zone%MZ.length),t+.45+k*.08,.12,1.2));
  },
  near(){
    if(!sfxOk())return;const t=T();
    noise(t,.45,.1,{f0:3500,f1:300,q:1.5,a:.02});
    voice('sine',520,t,.35,.07,{to:180,a:.01});
    mSlow=AC.currentTime+.55;
  },
  shieldSave(){
    if(!sfxOk())return;const t=T();
    voice('sine',300,t,.35,.14,{to:900,a:.02,verb:.4});
    [0,2,4].forEach((d,k)=>bell(zNote(d+5),t+.18+k*.06,.11,.8));
  },
  shieldBreak(){
    if(!sfxOk())return;const t=T();
    noise(t,.28,.12,{type:'highpass',f0:5000,q:.6,a:.002,verb:.4});
    [2600,2000,1500].forEach((f,k)=>voice('triangle',f,t+k*.04,.18,.07,{to:f*.5,a:.002,verb:.4}));
  },
  die(){
    if(!sfxOk())return;const t=T();
    voice('sine',150,t,.7,.42,{to:32,a:.003});
    noise(t,.55,.22,{type:'lowpass',f0:2400,f1:150,q:.7,a:.004,verb:.4});
    voice('sawtooth',330,t,.6,.12,{to:70,a:.005,lp:1800,lpTo:200,verb:.3});
    voice('sawtooth',335,t,.6,.1,{to:72,a:.005,lp:1800,lpTo:200,det:12});
    mSlow=AC.currentTime+.9;
  },
  newBest(){
    if(!sfxOk())return;const t=T();
    [0,2,4,5,7,9,10].forEach((d,k)=>bell(zNote(d+3),t+k*.075,.14,1));
    noise(t+.3,.6,.05,{type:'highpass',f0:6000,a:.1,verb:.6});
  },
  revive(){
    if(!sfxOk())return;const t=T();
    voice('sine',220,t,.5,.14,{to:880,a:.1,verb:.4});
    [0,2,4,7].forEach((d,k)=>bell(zNote(d+5),t+.3+k*.06,.12,.9));
  },
  buy(){
    if(!sfxOk())return;const t=T();
    bell(zNote(7),t,.15,.7);bell(zNote(9),t+.08,.15,.9);bell(zNote(12),t+.16,.12,1.1);
    noise(t,.3,.04,{type:'highpass',f0:7000,a:.01,verb:.5});
  },
  claim(){
    if(!sfxOk())return;const t=T();
    bell(zNote(5),t,.14,.7);bell(zNote(7),t+.07,.14,.8);bell(zNote(10),t+.14,.12,1);
  },
  ach(){
    if(!sfxOk())return;const t=T();
    [0,2,4].forEach((d,k)=>bell(zNote(d+5),t+k*.09,.14,1.2));
  },
  error(){
    if(!sfxOk())return;const t=T();
    voice('triangle',170,t,.12,.2,{to:120,a:.002});
    voice('triangle',140,t+.11,.16,.2,{to:90,a:.002});
  }
};

/* ----- music: generative, reacts to the game ----- */
function startMusic(){
  if(!AC||!save.set.music||mOn)return;
  mOn=true;mNext=AC.currentTime+.08;mStep=0;
  MG.gain.cancelScheduledValues(AC.currentTime);
  MG.gain.setValueAtTime(MG.gain.value,AC.currentTime);
  MG.gain.linearRampToValueAtTime(MUSIC_VOL,AC.currentTime+1.8);
  mTimer=setInterval(mSched,30);
}
function stopMusic(){
  mOn=false;
  if(mTimer){clearInterval(mTimer);mTimer=null;}
  if(AC&&MG){
    const n=AC.currentTime;
    MG.gain.cancelScheduledValues(n);MG.gain.setValueAtTime(MG.gain.value,n);MG.gain.linearRampToValueAtTime(0,n+.4);
    mVerb.gain.setTargetAtTime(0,n,.15);mEcho.gain.setTargetAtTime(0,n,.15);
  }
}
function mSched(){
  if(!AC||!mOn)return;
  if(AC.state!=='running'){mNext=AC.currentTime+.1;return;}
  if(mNext<AC.currentTime-.5)mNext=AC.currentTime+.05;
  const lim=AC.currentTime+.14;
  while(mNext<lim){mStepAt(mStep,mNext);mNext+=STEP;mStep++;}
}
/* 0 = calm (menu, pause, game over), 1 = playing, 2 = building, 3 = full */
function mIntensity(){
  if(state!=='play')return 0;
  if(!run.started)return 1;
  const sc=run.score||0,cb=run.combo||0;
  let v=1;if(sc>=8||cb>=3)v=2;if(sc>=22||cb>=6)v=3;
  return v;
}
function mControl(t,inten){
  let cut=7000+inten*1400,lvl=1;
  if(state==='home'){cut=2600;lvl=.9;}
  else if(state==='pause'){cut=650;lvl=.55;}
  else if(state==='over'){cut=900;lvl=.7;}
  if(AC.currentTime<mSlow)cut=Math.min(cut,900);
  mFilter.frequency.setTargetAtTime(cut,t,.12);
  MB.gain.setTargetAtTime(lvl,t,.25);
  mVerb.gain.setTargetAtTime(.4*lvl,t,.25);
  mEcho.gain.setTargetAtTime(.45*lvl,t,.25);
}
function padNote(m,t,dur,vol){
  const f=mtof(m),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.Q.value=.6;
  lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+dur*.5);lp.frequency.linearRampToValueAtTime(700,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+1.2);g.gain.setValueAtTime(vol,t+dur-1.4);g.gain.linearRampToValueAtTime(.0001,t+dur);
  g.connect(lp);lp.connect(padBus);lp.connect(mVerb);
  for(let k=0;k<2;k++){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=k?9:-9;o.connect(g);
    aVoices++;
    o.onended=function(){aVoices--;if(k){try{g.disconnect();lp.disconnect();}catch(e){}}};
    o.start(t);o.stop(t+dur+.05);
  }
}
function mPluck(m,t,vol){
  voice('triangle',mtof(m),t,.42,vol*1.1,{a:.003,bus:MB,lp:3400,lpTo:900,verb:1,dly:1});
}
function mStepAt(step,t){
  const pos=step%32,p=step%16;
  if(pos===0)mZone=((state==='home')?0:(run.zone||0))%MZ.length;
  const Z=MZ[mZone],pr=Z.prog[Math.floor(step/32)%4],rootM=Z.root+pr[0],ch=CHORD[pr[1]];
  const inten=mIntensity();
  if(step%4===0)mControl(t,inten);

  /* pad: one chord every two bars; the four notes start on consecutive steps so the work is spread out */
  if(pos<4){
    const dur=(32-pos)*STEP+1.4,v=.03;
    if(pos===0)padNote(rootM,t,dur,v);
    else padNote(rootM+12+ch[pos],t,dur,v*.85);
  }

  /* bass */
  let hit=false;
  if(inten===1)hit=(p===0);
  else if(inten===2)hit=(p===0||p===6||p===10);
  else if(inten>=3)hit=(p===0||p===3||p===6||p===10||p===14);
  if(hit){
    const f=mtof(rootM+((p===10||p===14)?7:0));
    voice('sine',f,t,.38,.2,{a:.008,bus:padBus});
    voice('triangle',f*2,t,.22,.07,{a:.008,bus:padBus,lp:900});
  }

  /* melody: chord tones in two octaves */
  const tones=[];
  for(let k=0;k<4;k++)tones.push(rootM+12+ch[k]);
  for(let k=0;k<4;k++)tones.push(rootM+24+ch[k]);
  if(inten===0){
    if(p===0&&Math.random()<.55){
      const m=tones[4+Math.floor(Math.random()*4)]+12*(Math.random()<.3?1:0);
      voice('sine',mtof(m),t,1.7,.05,{a:.01,bus:MB,verb:1,dly:1});
    }
  } else if(inten===1){
    if(step%2===0&&Math.random()<.55)mPluck(tones[(step>>1)%8],t,.045);
  } else if(inten===2){
    if(step%2===0)mPluck(tones[(step>>1)%8],t,.05);
    else if(step%4===3&&Math.random()<.4)mPluck(tones[(step*3)%8],t,.03);
  } else {
    if(step%2===0||Math.random()<.55)mPluck(tones[(step*3)%8],t,step%2===0?.052:.034);
  }

  /* percussion */
  if(inten>=2){
    if(step%2===1)noise(t,.035,.028,{type:'highpass',f0:7500,a:.001,bus:MB});
    if(p===14)noise(t,.18,.026,{type:'highpass',f0:7000,a:.002,bus:MB});
    const kick=inten>=3?(p%4===0):(p===0||p===8);
    if(kick){
      voice('sine',130,t,.2,.32,{to:42,glide:.1,a:.001,bus:MB});
      padBus.gain.cancelScheduledValues(t);
      padBus.gain.setValueAtTime(.55,t);padBus.gain.linearRampToValueAtTime(1,t+.24);
    }
    if(inten>=3&&(p===4||p===12))noise(t,.13,.05,{f0:1900,q:.8,a:.002,bus:MB,verb:1});
  }
}

/* ---------- glow sprites, trails, orbs ---------- */
const glowCache={};
function glowSprite(h){
  h=((Math.round(h/6)*6)%360+360)%360;
  let c=glowCache[h];
  if(!c){
    c=document.createElement('canvas');c.width=c.height=64;
    const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'hsla('+h+',100%,72%,.95)');gr.addColorStop(.35,'hsla('+h+',100%,60%,.34)');gr.addColorStop(1,'hsla('+h+',100%,50%,0)');
    g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache[h]=c;
  }
  return c;
}
function drawGlow(c,x,y,r,h,a){c.globalAlpha=a;c.drawImage(glowSprite(h),x-r,y-r,r*2,r*2);c.globalAlpha=1;}

function tcol(id,i,t,hv,tm){
  switch(id){
    case 'fire':return 'hsl('+(8+t*45)+',100%,'+(46+t*14)+'%)';
    case 'rainbow':return 'hsl('+((i*14+tm*220)%360)+',100%,62%)';
    case 'stardust':return '#fff3b8';
    case 'plasma':return 'hsl('+(300-t*105)+',100%,'+(58+Math.sin(i*.6+tm*8)*9)+'%)';
    default:return 'hsl('+hv+',100%,'+(58+t*14)+'%)';
  }
}
function drawTrailPts(c,pts,id,hv,tm,wm){
  const n=pts.length;if(n<2)return;
  c.save();c.lineCap='round';c.lineJoin='round';c.globalCompositeOperation='lighter';
  if(id==='stardust')c.setLineDash([1.5*wm,9*wm]);
  for(let i=1;i<n;i++){
    const t=i/n;c.strokeStyle=tcol(id,i,t,hv,tm);
    c.globalAlpha=t*.2;c.lineWidth=(7+t*11)*wm;
    c.beginPath();c.moveTo(pts[i-1].x,pts[i-1].y);c.lineTo(pts[i].x,pts[i].y);c.stroke();
    c.globalAlpha=t*.92;c.lineWidth=(1.5+t*4.5)*wm;
    c.beginPath();c.moveTo(pts[i-1].x,pts[i-1].y);c.lineTo(pts[i].x,pts[i].y);c.stroke();
  }
  c.restore();
}
function drawOrb(c,skin,x,y,r,hv,tm){
  c.save();
  switch(skin){
    case 'ember':{
      const rr=r*(1+.1*Math.sin(tm*28));
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,rr*4.2,18,.9);c.globalCompositeOperation='source-over';
      const g=c.createRadialGradient(x,y,0,x,y,rr*1.2);g.addColorStop(0,'#fff8cf');g.addColorStop(.5,'#ff9a1a');g.addColorStop(1,'#ff3d00');
      c.fillStyle=g;c.beginPath();c.arc(x,y,rr*1.15,0,6.283);c.fill();break;}
    case 'halo':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*3.6,hv,.8);c.globalCompositeOperation='source-over';
      c.strokeStyle='#fff';c.lineWidth=Math.max(1.8,r*.34);c.beginPath();c.arc(x,y,r,0,6.283);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(x,y,r*.32,0,6.283);c.fill();break;}
    case 'gem':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*3.6,190,.75);c.globalCompositeOperation='source-over';
      c.translate(x,y);c.rotate(tm*1.2);const s=r*1.1;
      const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#fff');g.addColorStop(.5,'hsl(190,100%,70%)');g.addColorStop(1,'hsl(262,90%,66%)');
      c.fillStyle=g;c.beginPath();c.moveTo(0,-s*1.25);c.lineTo(s,0);c.lineTo(0,s*1.25);c.lineTo(-s,0);c.closePath();c.fill();
      c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.2;c.stroke();break;}
    case 'eclipse':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*4.4,hv,.95);c.globalCompositeOperation='source-over';
      c.fillStyle='#04050b';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();
      c.strokeStyle='hsl('+hv+',100%,78%)';c.lineWidth=Math.max(2,r*.3);c.stroke();break;}
    default:{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*4,hv,.85);c.globalCompositeOperation='source-over';
      const g=c.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfe0ff');
      c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}
  }
  c.restore();
}

/* ---------- game state ---------- */
let state='home'; // home | play | pause | over
let mode='free',rng=Math.random;
let anchors=[],items=[],trail=[],parts=[],popups=[],rings=[],player=null,run={};
let time=0,camY=0,shake=0,slowT=0,flash=0,hue=232,hueT=232,overT=0;
const stars=[];for(let i=0;i<70;i++)stars.push({fx:Math.random(),fy:Math.random(),z:.03+Math.random()*.22,r:.6+Math.random()*1.6,tw:1+Math.random()*3,ph:Math.random()*6.28});

function speed(){return 240+Math.min(run.score,70)*1.5;}
function bestNow(){return mode==='daily'?save.daily.best:save.best;}
function bestIdxNow(){return mode==='daily'?save.daily.idx:save.bestIdx;}

function ensureDay(){
  const d=dayKey();
  if(save.daily.day!==d)save.daily={day:d,best:0,idx:0};
  if(save.missions.day!==d)save.missions={day:d,list:genMissions(d)};
}
function genMissions(d){
  const r=mulberry32(d*31+7),idx=MPOOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  return [0,1,2].map(t=>{const p=MPOOL[idx[t]];return{id:p.id,target:p.vals[t],rew:[30,60,100][t],prog:0,claimed:false};});
}
function mEvent(id,v){
  save.missions.list.forEach(m=>{
    if(m.id!==id||m.claimed)return;
    const p=MPOOL.find(x=>x.id===id);
    m.prog=p.max?Math.max(m.prog,v):m.prog+v;
  });
}
function checkAch(){
  ACH.forEach(a=>{
    if(save.ach[a.id])return;
    const pr=a.p();
    if(pr[0]>=pr[1]){save.ach[a.id]=1;save.coins+=a.rew;toast('Achievement: '+a.n+'  +'+a.rew);sfx.ach();}
  });
}

function newRun(){
  rng=mode==='daily'?mulberry32(dayKey()):Math.random;
  anchors=[];items=[];parts=[];popups=[];rings=[];trail=[];
  run={score:0,combo:0,maxIdx:0,chainIdx:0,lastChain:null,started:false,shards:0,perfects:0,bestCombo:0,revived:false,counted:false,
    bonusPaid:0,shield:false,magnetT:0,surgeT:0,invuln:0,t:0,perfect:false,zone:0,streak:0,lastShard:-9};
  shake=0;slowT=0;flash=0;time=0;
  const a0={x:FW/2,bx:FW/2,y:0,idx:0,haz:false,amp:0,ph:0,f:1,van:false,catchR:52,vt:0,gone:false};
  anchors.push(a0);run.lastChain=a0;
  player={x:a0.x+60,y:a0.y,vx:0,vy:0,latched:a0,ang:0,dir:1,r:60,flightT:0,flyDist:0,prev:null,cool:0};
  camY=-H*0.62;
  hue=hueT=ZONES[0].h;

function setAccent(){
  const z=ZONES[run.zone%ZONES.length],h=z.h,r=document.documentElement.style;
  r.setProperty('--acc','hsl('+h+',90%,72%)');r.setProperty('--acc2','hsl('+((h+50)%360)+',85%,66%)');
  const hz=$('homeZone');if(hz)hz.textContent=z.n;
}

function spawn(){
  const i=++run.chainIdx,p=run.lastChain;
  const gap=Math.min(235,125+i*2.6)*(0.85+rng()*0.3);
  let x=p.bx+(rng()*2-1)*Math.min(180,90+i*3);
  x=clamp(x,50,FW-50);
  const a={x:x,bx:x,y:p.y-gap,idx:i,haz:false,amp:0,ph:rng()*6.28,f:1+rng()*.8,van:false,catchR:52,vt:0,gone:false};
  if(i>=10&&rng()<Math.min(.55,(i-8)*.03)){a.amp=35+rng()*35;a.bx=clamp(x,50+a.amp,FW-50-a.amp);a.x=a.bx;}
  if(i>=20&&rng()<.22)a.van=true;
  anchors.push(a);run.lastChain=a;
  if(rng()<.6){
    const n=1+Math.floor(rng()*3);
    for(let k=0;k<n;k++){
      const t=.34+.32*(n===1?.5:k/(n-1));
      items.push({k:'s',x:p.bx+(a.bx-p.bx)*t,y:p.y+(a.y-p.y)*t,got:0});
    }
  }
  if(i>=6&&rng()<.07){
    const types=['shield','magnet','surge'],ty=types[Math.floor(rng()*3)],side=rng()<.5?-1:1;
    items.push({k:'p',type:ty,x:clamp((p.bx+a.bx)/2+side*62,30,FW-30),y:(p.y+a.y)/2,got:0});
  }
  if(i>=5&&rng()<Math.min(.5,.12+i*.01)){
    const side=rng()<.5?-1:1,hx=clamp(a.bx+side*(80+rng()*40),30,FW-30);
    const h={x:hx,bx:hx,y:a.y+(rng()*80-30),idx:-1,haz:true,amp:0,ph:rng()*6,f:1.2,van:false,catchR:0,vt:0,gone:false,near:false};
    if(i>=15&&rng()<.35){h.amp=30;h.bx=clamp(hx,60,FW-60);}
    anchors.push(h);
  }
}

function burst(x,y,n,col,spd){
  if(parts.length>(renderScale<.85?60:110))return;
  for(let i=0;i<n;i++){
    const an=Math.random()*6.283,v=(.3+Math.random())*(spd||120);
    parts.push({x:x,y:y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:.5+Math.random()*.4,max:.9,col:col});
  }
}
function ring(x,y,h,max){rings.push({x:x,y:y,r:6,max:max||80,t:0,h:h});}

function aimInfo(dx,dy){
  const p=player;let tgt=null;
  for(const a of anchors){if(a.haz||a.gone||a.idx<=run.maxIdx)continue;if(!tgt||a.idx<tgt.idx)tgt=a;}
  if(!tgt)return{ok:false};
  const tx=tgt.x-p.x,ty=tgt.y-p.y,along=tx*dx+ty*dy,perp=Math.abs(tx*dy-ty*dx);
  return{ok:along>20&&perp<15,tgt:tgt,along:along};
}

function release(auto){
  const p=player,a=p.latched;if(!a)return;
  const v=speed(),dx=-Math.sin(p.ang)*p.dir,dy=Math.cos(p.ang)*p.dir;
  if(!auto){
    const info=aimInfo(dx,dy);
    run.perfect=!!info.ok;
    if(info.ok){
      run.perfects++;save.stats.perfects++;mEvent('perfect',1);
      ring(p.x,p.y,48,70);sfx.perfect();
      popups.push({x:p.x,y:p.y-26,t:0,txt:'Perfect',sub:'',h:48});vib(12);
    }
  }
  p.vx=dx*v;p.vy=dy*v;
  p.prev=a;p.cool=.35;p.latched=null;p.flightT=0;p.flyDist=0;run.started=true;
  if(auto)a.gone=true;
  sfx.release();
  burst(p.x,p.y,6,'hsl('+hue+',100%,75%)',70);
  $('hint').classList.add('hide');
}

function latch(a,d,dx,dy){
  const p=player;
  const cross=dx*p.vy-dy*p.vx;p.dir=cross>=0?1:-1;
  p.r=clamp(d,32,a.catchR);p.ang=Math.atan2(dy,dx);p.latched=a;a.vt=0;
  if(a.idx>run.maxIdx){
    const n=a.idx-run.maxIdx;
    const quick=n===1&&p.flightT<1.0;
    run.combo=quick?run.combo+1:0;
    if(run.combo>run.bestCombo){run.bestCombo=run.combo;if(run.combo>save.stats.bestCombo)save.stats.bestCombo=run.combo;mEvent('combo',run.combo);}
    run.maxIdx=a.idx;
    let pts=n+Math.min(3,Math.floor(run.combo/3))+(run.perfect?2:0);
    if(run.surgeT>0)pts*=2;
    run.score+=pts;save.stats.latches++;
    let sub='';if(n>1)sub='Skip x'+n;else if(run.combo>=2)sub='x'+run.combo;
    popups.push({x:a.x,y:a.y-34,t:0,txt:'+'+pts,sub:sub,h:hue});
    burst(a.x,a.y,12+Math.min(run.combo,8)*2,'hsl('+hue+',100%,70%)',150);
    ring(a.x,a.y,hue,70);
    sfx.latch(run.combo);
    if(save.set.shake)shake=Math.max(shake,2+Math.min(run.combo,6));
    vib(8);hudScore(true);
    const z=Math.floor(run.score/25);
    if(z>run.zone){run.zone=z;zoneChange();}
  } else {

  }

}
function zoneChange(){
  if(spriteCache.size>150)spriteCache.clear();   /* drop the previous zone's cached colours */
  const z=ZONES[run.zone%ZONES.length];hueT=z.h;setAccent();hudScore(false);
  toast('Zone '+(run.zone+1)+' · '+z.n);
  ring(player.x,player.y,z.h,160);sfx.zone();vib([10,30,10]);
}

function collect(it){
  if(it.k==='s'){
    if(time-run.lastShard>.7)run.streak=0;
    run.lastShard=time;run.streak++;
    run.shards++;save.coins++;save.stats.shards++;mEvent('shards',1);
    burst(it.x,it.y,5,'#ffd166',90);
    sfx.shard(run.streak);
    hudCoins();
  } else {
    const info=PU[it.type];
    save.stats.powerups++;mEvent('power',1);
    if(it.type==='shield')run.shield=true;
    if(it.type==='magnet')run.magnetT=8;
    if(it.type==='surge')run.surgeT=10;
    burst(it.x,it.y,16,'hsl('+info.h+',100%,70%)',160);ring(it.x,it.y,info.h,70);
    popups.push({x:it.x,y:it.y-26,t:0,txt:info.t,sub:'',h:info.h});
    sfx.power(it.type);vib(15);
  }
}

function rescue(){
  const p=player;let best=null,bd=1e9;
  for(const a of anchors){
    if(a.haz||a.gone||a.y>camY+H*0.9)continue;
    const d=Math.abs(a.y-p.y)+Math.abs(a.x-p.x)*.3;
    if(d<bd){bd=d;best=a;}
  }
  if(!best)return false;
  p.latched=best;p.r=52;p.ang=Math.PI/2;p.dir=1;p.vx=p.vy=0;p.prev=null;p.cool=0;p.flightT=0;
  p.x=best.x+Math.cos(p.ang)*p.r;p.y=best.y+Math.sin(p.ang)*p.r;
  camY=Math.min(camY,p.y-H*0.55);trail=[];
  run.invuln=1.4;run.combo=0;
  return true;
}

function die(why){
  if(state!=='play'||run.invuln>0)return;
  if(why==='hole'&&run.shield&&rescue()){run.shield=false;ring(player.x,player.y,195,100);popups.push({x:player.x,y:player.y-30,t:0,txt:'Shield saved you',sub:'',h:195});sfx.shieldSave();return;}
  state='over';overT=0;
  const p=player;
  burst(p.x,p.y,46,'#ff6b8a',280);ring(p.x,p.y,350,100);
  flash=.55;if(save.set.shake)shake=14;
  sfx.die();vib([30,40,60]);
  const prevBest=bestNow(),isNew=run.score>prevBest&&run.score>0;
  if(isNew){if(mode==='daily'){save.daily.best=run.score;save.daily.idx=run.maxIdx;}else{save.best=run.score;save.bestIdx=run.maxIdx;}}
  if(run.score>save.bestAll)save.bestAll=run.score;
  if(!run.counted){run.counted=true;save.stats.runs++;Ads.since++;mEvent('runs',1);}
  mEvent('score',run.score);
  const bonus=Math.floor(run.score/3)-run.bonusPaid;run.bonusPaid+=bonus;save.coins+=bonus;
  checkAch();persist();
  fillOver(isNew);
  if(isNew)setTimeout(function(){sfx.newBest();},650);
  $('over').classList.remove('hide');$('hud').classList.add('hide');
  hudCoins();
}

  busy:false,cb:null,since:0,last:Date.now(),
  has(){return typeof window.AndroidAds!=='undefined'&&window.AndroidAds!==null;},
  rewardedReady(){try{return this.has()&&!this.busy&&!!window.AndroidAds.hasRewarded();}catch(e){return false;}},
  showRewarded(done){
    if(!this.rewardedReady()){done(false);return;}
    this.busy=true;this.cb=done;
    try{window.AndroidAds.showRewarded();}catch(e){this.finish('rewarded','failed');}
  },
  /* one interstitial at most every 4 finished runs and every 90 s, never in the first 3 runs */
  interstitialDue(){return this.has()&&!this.busy&&save.stats.runs>=3&&this.since>=4&&Date.now()-this.last>90000;},
  showInterstitial(done){
    this.busy=true;this.cb=done;
    try{window.AndroidAds.showInterstitial();}catch(e){this.finish('interstitial','failed');}
  },
  finish(kind,status){
    const cb=this.cb;this.cb=null;this.busy=false;
    if(kind==='interstitial'){this.last=Date.now();this.since=0;}
    if(cb)cb(kind==='rewarded'?status==='reward':true);
  }
};

/* ---------- update ---------- */
function update(dt,real){
  time+=dt;
  hue+=((hueT-hue+540)%360-180)*Math.min(1,dt*1.5);
  for(const a of anchors){if(a.amp&&!a.gone)a.x=a.bx+Math.sin(time*a.f+a.ph)*a.amp;}
  const p=player;
  if(state==='over'){overT+=real;tickRevive(real);}

  if(state==='play'||state==='home'){
    if(p.latched){
      const a=p.latched;
      p.ang+=p.dir*(speed()/p.r)*dt;
      p.x=a.x+Math.cos(p.ang)*p.r;p.y=a.y+Math.sin(p.ang)*p.r;
      if(state==='play'&&a.van){a.vt+=dt;if(a.vt>1.7)release(true);}
    } else if(state==='play'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.flightT+=dt;p.flyDist+=Math.hypot(p.vx,p.vy)*dt;
      if(p.cool>0)p.cool-=dt;
      for(const a of anchors){
        if(a.gone)continue;
        const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);
        if(a.haz){
          if(run.invuln>0)continue;
          if(d<17){
            if(run.shield){
              run.shield=false;a.gone=true;run.invuln=.6;slowT=.25;
              burst(a.x,a.y,24,'#7fe3ff',200);ring(a.x,a.y,195,90);
              popups.push({x:a.x,y:a.y-28,t:0,txt:'Shield broke',sub:'',h:195});sfx.shieldBreak();vib(25);
              continue;
            }
            die('hazard');break;
          }
          if(d<46&&!a.near){a.near=true;slowT=.4;if(save.set.shake)shake=Math.max(shake,5);sfx.near();popups.push({x:a.x,y:a.y-26,t:0,txt:'Close call',sub:'',h:350});}
        } else if(d<a.catchR&&!(a===p.prev&&p.cool>0)){
          latch(a,d,dx,dy);break;
        }
      }
    }
  }

  if(state==='play'){
    run.t+=dt;save.stats.time+=dt;
    if(run.invuln>0)run.invuln-=dt;
    if(run.magnetT>0)run.magnetT-=dt;
    if(run.surgeT>0)run.surgeT-=dt;
    for(const it of items){
      if(it.got)continue;
      const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy);
      if(it.k==='s'&&run.magnetT>0&&d<150&&d>1){const sp=440*dt;it.x+=dx/d*sp;it.y+=dy/d*sp;}
      if(d<(it.k==='s'?22:28)){it.got=1;collect(it);}
    }
    if(run.started)camY-=(18+Math.min(run.score,70)*0.9)*dt;
    const target=p.y-H*0.6;
    if(target<camY)camY+=(target-camY)*Math.min(1,dt*5);
    if(!p.latched&&p.flyDist>FLY_MAX&&run.invuln<=0&&!run.shield)popups.push({x:p.x,y:p.y-26,t:0,txt:'Lost in space',sub:'',h:350});
    if(p.y-camY>H+30||p.x<-90||p.x>FW+90||(!p.latched&&p.flyDist>FLY_MAX))die('hole');
    updChips();
  }

  while(run.lastChain.y>camY-260)spawn();
  /* drop everything the player has left behind, in place (no new arrays every frame) */
  {let w=0;const lim=camY+H+350,pl=state==='play';
   for(let i=0;i<anchors.length;i++){const a=anchors[i];if(a.y<lim&&!(a.gone&&pl))anchors[w++]=a;}anchors.length=w;}
  {let w=0;const lim=camY+H+300;
   for(let i=0;i<items.length;i++){const it=items[i];if(!it.got&&it.y<lim)items[w++]=it;}items.length=w;}
  if(p.latched&&!anchors.includes(p.latched))p.latched=null;

  if(state!=='over'){trail.push({x:p.x,y:p.y});if(trail.length>36)trail.shift();}
  else if(trail.length)trail.shift();

  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.life-=dt;
    if(q.life<=0){parts[i]=parts[parts.length-1];parts.pop();}
  }
  for(let i=popups.length-1;i>=0;i--){const q=popups[i];q.t+=dt;q.y-=28*dt;if(q.t>.9)popups.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.t+=dt;q.r=6+(q.max-6)*Math.min(1,q.t/.5);if(q.t>.5)rings.splice(i,1);}
  shake*=Math.pow(.02,real);if(shake<.1)shake=0;
  flash=Math.max(0,flash-real*2);
  setBGHue();
}

/* ---------- draw ---------- */
/* ---------- cached sprites: each is drawn once per colour and reused every frame ---------- */
const spriteCache=new Map();
function qh(h,st){return (((Math.round(h/st)*st)%360)+360)%360;}
function getSprite(kind,h){
  const key=kind*1000+h;let c=spriteCache.get(key);if(c)return c;
  if(spriteCache.size>500)spriteCache.clear();
  c=document.createElement('canvas');const g=c.getContext('2d');
  if(kind===1){            /* anchor core */
    c.width=c.height=72;g.scale(3,3);g.translate(12,12);
    const gr=g.createRadialGradient(-2,-2,1,0,0,9);gr.addColorStop(0,'#fff');gr.addColorStop(1,'hsl('+h+',90%,62%)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,8.5,0,6.283);g.fill();
  } else if(kind===2){     /* dashed catch ring, radius 52 */
    c.width=c.height=224;g.scale(2,2);g.translate(56,56);
    g.strokeStyle='hsl('+h+',90%,74%)';g.lineWidth=1.3;g.setLineDash([3,7]);g.beginPath();g.arc(0,0,52,0,6.283);g.stroke();
  } else if(kind===3){     /* soft background glow */
    c.width=c.height=128;
    const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'hsla('+h+',80%,45%,.16)');gr.addColorStop(1,'hsla('+h+',80%,45%,0)');
    g.fillStyle=gr;g.fillRect(0,0,128,128);
  } else if(kind===4){     /* background colour strip, stretched over the screen */
    c.width=2;c.height=128;
    const gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'hsl('+h+',55%,5%)');gr.addColorStop(1,'hsl('+((h+28)%360)+',55%,15%)');
    g.fillStyle=gr;g.fillRect(0,0,2,128);
  } else {                 /* star dot */
    c.width=c.height=16;g.fillStyle='#fff';g.beginPath();g.arc(8,8,7,0,6.283);g.fill();
  }
  spriteCache.set(key,c);return c;
}
function anchorCol(a){return a.van?35:(a.amp?(hue+150)%360:hue);}
const bgl=document.getElementById('bgl');let bgQ=-1;
function setBGHue(){
  const q=Math.round(hue);if(q===bgQ)return;bgQ=q;
  const st=bgl.style;
  st.setProperty('--b1','hsl('+q+',55%,5%)');st.setProperty('--b2','hsl('+((q+28)%360)+',55%,15%)');
  for(let i=0;i<3;i++)st.setProperty('--g'+i,'hsla('+((q+40*i)%360)+',80%,45%,.2)');
}
function drawBG(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const star=getSprite(5,0);
  for(let i=0;i<stars.length;i++){
    const s=stars[i];
    const sy=(((s.fy*cv.height-camY*S*s.z)%cv.height)+cv.height)%cv.height;
    ctx.globalAlpha=(.2+s.z)*(.55+.45*Math.abs(Math.sin(time*s.tw+s.ph)));
    const rr=s.r*S*.5;ctx.drawImage(star,s.fx*cv.width-rr,sy-rr,rr*2,rr*2);
  }
  ctx.globalAlpha=1;
}
/* all additive glows in one pass (one blend-mode switch instead of one per object) */
function drawGlows(nAnch,vTop,vBot){
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<nAnch;i++){
    const a=anchors[i];if(a.gone||a.y<vTop||a.y>vBot)continue;
    if(a.haz){drawGlow(ctx,a.x,a.y,34,350,.7);continue;}
    const pulse=.5+.5*Math.sin(time*3+a.idx*1.7);
    drawGlow(ctx,a.x,a.y,34+pulse*4+(player.latched===a?8:0),anchorCol(a),.55);
  }
  if(nAnch>1){
    for(let i=0;i<items.length;i++){
      const it=items[i];if(it.got||it.y<vTop||it.y>vBot)continue;
      if(it.k==='s')drawGlow(ctx,it.x,it.y,15,45,.6);else drawGlow(ctx,it.x,it.y,26+Math.sin(time*4)*3,PU[it.type].h,.7);
    }
  }
  ctx.globalCompositeOperation='source-over';
}
function drawAnchor(a){
  if(a.gone)return;
  if(a.haz){
    ctx.save();ctx.translate(a.x,a.y);
    ctx.rotate(time*1.5);ctx.fillStyle='#ff2d55';
    ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?7:15,an=i*Math.PI/4;ctx.lineTo(Math.cos(an)*r,Math.sin(an)*r);}
    ctx.closePath();ctx.fill();ctx.fillStyle='#2a0610';ctx.beginPath();ctx.arc(0,0,4,0,6.283);ctx.fill();ctx.restore();
    return;
  }
  const col=anchorCol(a),qc=qh(col,3);
  const lat=player.latched===a,pulse=.5+.5*Math.sin(time*3+a.idx*1.7);
  if(a.amp){
    ctx.globalAlpha=.12;ctx.strokeStyle='hsl('+col+',80%,70%)';ctx.lineWidth=1.2;ctx.setLineDash([2,6]);
    ctx.beginPath();ctx.moveTo(a.bx-a.amp,a.y);ctx.lineTo(a.bx+a.amp,a.y);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(time*.4);ctx.globalAlpha=.15+.1*pulse+(lat?.2:0);
  ctx.drawImage(getSprite(2,qc),-56,-56,112,112);ctx.restore();
  ctx.drawImage(getSprite(1,qc),a.x-12,a.y-12,24,24);
  if(a.van){
    /* orange anchors crumble: dashed ring always, urgent flashing once you hold one */
    ctx.save();ctx.strokeStyle='hsl(30,100%,62%)';ctx.lineWidth=1.6;ctx.globalAlpha=.55;ctx.setLineDash([3,5]);
    ctx.beginPath();ctx.arc(a.x,a.y,19,time*.8,time*.8+6.283);ctx.stroke();ctx.restore();
    if(a.vt>0){
      const f=1-Math.min(1,a.vt/1.7);
      ctx.strokeStyle=f<.4?'#ff5a4a':'#fff';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.beginPath();
      ctx.arc(a.x,a.y,14,-Math.PI/2,-Math.PI/2+f*Math.PI*2);ctx.stroke();
      if(f<.45){ctx.globalAlpha=.35+.35*Math.sin(time*40);ctx.fillStyle='#ff5a4a';ctx.beginPath();ctx.arc(a.x,a.y,12,0,6.283);ctx.fill();ctx.globalAlpha=1;}
    }
  }
}
function drawItems(vTop,vBot){
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(it.got||it.y<vTop||it.y>vBot)continue;
    if(it.k==='s'){
      ctx.save();ctx.translate(it.x,it.y);ctx.rotate(time*2.2+it.x);
      const w=5.5+Math.sin(time*5+it.y)*.8;
      ctx.fillStyle='#ffd166';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(w,0);ctx.lineTo(0,8);ctx.lineTo(-w,0);ctx.closePath();ctx.fill();ctx.restore();
    } else {
      const h=PU[it.type].h,x=it.x,y=it.y;
      ctx.fillStyle='hsla('+h+',90%,16%,.92)';ctx.strokeStyle='hsl('+h+',95%,70%)';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(x,y,12,0,6.283);ctx.fill();ctx.stroke();
      ctx.lineWidth=1.6;ctx.lineCap='round';ctx.lineJoin='round';
      if(it.type==='shield'){
        ctx.beginPath();ctx.moveTo(x,y-6);ctx.lineTo(x+5,y-3);ctx.lineTo(x+4,y+3);ctx.lineTo(x,y+7);ctx.lineTo(x-4,y+3);ctx.lineTo(x-5,y-3);ctx.closePath();ctx.stroke();
      } else if(it.type==='magnet'){
        ctx.beginPath();ctx.moveTo(x-5,y-5);ctx.lineTo(x-5,y);ctx.arc(x,y,5,Math.PI,0,true);ctx.lineTo(x+5,y-5);ctx.stroke();
      } else {
        ctx.fillStyle='hsl('+h+',95%,76%)';ctx.font='700 10.5px '+FONT;ctx.textAlign='center';ctx.fillText('x2',x,y+3.5);
      }
    }
  }
}
function drawAim(){
  const p=player;
  if(!p.latched||state!=='play'||!save.set.guide)return;
  const dx=-Math.sin(p.ang)*p.dir,dy=Math.cos(p.ang)*p.dir,info=aimInfo(dx,dy);
  ctx.save();ctx.lineCap='round';ctx.setLineDash([2,9]);
  ctx.strokeStyle=info.ok?'hsl(48,100%,68%)':'hsl('+hue+',100%,86%)';
  ctx.lineWidth=info.ok?2.4:1.6;ctx.globalAlpha=info.ok?.9:.3;
  const len=info.ok?Math.min(info.along,300):185;
  ctx.beginPath();ctx.moveTo(p.x+dx*12,p.y+dy*12);ctx.lineTo(p.x+dx*len,p.y+dy*len);ctx.stroke();
  if(info.ok){ctx.setLineDash([]);ctx.globalAlpha=.8;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(info.tgt.x,info.tgt.y,17+Math.sin(time*10)*2,0,6.283);ctx.stroke();}
  ctx.restore();
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  drawBG();
  ctx.setTransform(S,0,0,S,offX*S,0);
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  ctx.translate(sx,-camY+sy);

  // best-height marker
  const bi=bestIdxNow();
  if(bi>0){
    for(const a of anchors){
      if(a.idx===bi&&!a.haz){
        ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.setLineDash([4,8]);ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(-60,a.y);ctx.lineTo(FW+60,a.y);ctx.stroke();
        ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='600 10.5px '+FONT;ctx.textAlign='left';
        ctx.fillText('BEST',12,a.y-7);ctx.restore();
      }
    }
  }

  const vTop=camY-90,vBot=camY+H+90;
  drawGlows(state==='home'?1:anchors.length,vTop,vBot);
  if(state!=='home'){
    drawItems(vTop,vBot);
    for(let i=0;i<anchors.length;i++){const a=anchors[i];if(a.y>vTop&&a.y<vBot)drawAnchor(a);}
  } else drawAnchor(anchors[0]);

  const p=player;
  if(p.latched&&state!=='over'){
    const a=p.latched;
    ctx.strokeStyle='hsla('+hue+',100%,80%,.15)';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  }
  drawAim();
  drawTrailPts(ctx,trail,save.sel.trail,hue,time,1);

  if(state!=='over'){
    const blink=run.invuln>0&&Math.floor(time*14)%2===0;
    const fade=(!p.latched&&state==='play')?clamp((p.flyDist-FLY_MAX*.62)/(FLY_MAX*.38),0,1):0;
    if(fade>0)ctx.globalAlpha=1-.7*fade*(.5+.5*Math.sin(time*(14+fade*22)));
    if(!blink)drawOrb(ctx,save.sel.skin,p.x,p.y,7,hue,time);
    ctx.globalAlpha=1;
    if(run.shield){
      ctx.strokeStyle='hsla(195,95%,72%,'+(.65+.25*Math.sin(time*6))+')';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.arc(p.x,p.y,15,0,6.283);ctx.stroke();
    }
    if(run.magnetT>0){
      ctx.globalAlpha=.22*(1-((time*1.4)%1));ctx.strokeStyle='hsl(46,100%,70%)';ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(p.x,p.y,20+((time*1.4)%1)*110,0,6.283);ctx.stroke();ctx.globalAlpha=1;
    }
  }

  ctx.globalCompositeOperation='lighter';
  for(const q of parts){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,2.2,0,6.283);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const q of rings){
    ctx.globalAlpha=(1-q.t/.5)*.75;ctx.strokeStyle='hsl('+q.h+',100%,72%)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center';
  for(const q of popups){
    const al=Math.max(0,1-q.t/.9);ctx.globalAlpha=al;
    ctx.fillStyle='#fff';ctx.font='600 18px '+FONT;ctx.fillText(q.txt,q.x,q.y);
    if(q.sub){ctx.fillStyle='hsl('+q.h+',100%,76%)';ctx.font='600 11px '+FONT;ctx.fillText(q.sub,q.x,q.y+15);}
  }
  ctx.globalAlpha=1;

  if(flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(255,60,90,'+(flash*.45)+')';ctx.fillRect(0,0,cv.width,cv.height);}
}

/* ---------- loop ---------- */
let last=performance.now();
/* If the phone cannot keep up, draw at a lower resolution until it can (the picture stays sharp enough, the game stays smooth). */
let gAvg=16.7,gLast=0,gGood=0,gUps=0,bodyState='';
/* Adaptive quality: drops resolution fast when frames get slow (e.g. the phone's GPU path
   degrades after a notification or an ad), and gives some back when it runs smoothly again. */
function governor(now,raw){
  if(state!=='play'||document.hidden||raw>250)return;
  gAvg+=(raw-gAvg)*.08;
  const since=now-gLast;
  if(gAvg>24&&since>1500&&renderScale>.52){
    renderScale=Math.max(.5,renderScale*(gAvg>40?.68:.85));gLast=now;gAvg=16.7;gGood=0;resize();
  }else if(gAvg<18.5&&renderScale<1&&gUps<3){
    gGood+=raw;
    if(gGood>12000&&since>12000){renderScale=Math.min(1,renderScale*1.2);gLast=now;gGood=0;gUps++;resize();}
  }else gGood=0;
}
/* coming back from a notification shade, another app or an ad: reset timing and re-create the canvas buffer */
function wake(){
  last=performance.now();gAvg=16.7;gGood=0;gLast=performance.now();
  renderScale=1;gUps=0;resize();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});
addEventListener('focus',function(){wake();});
function frame(now){
  const raw=now-last;let real=raw/1000;last=now;
  if(real>.033)real=.033;
  if(state!=='pause'){
    let ts=1;if(slowT>0){ts=.4;slowT-=real;}
    update(real*ts,real);
  }
  governor(now,raw);
  if(state!==bodyState){bodyState=state;document.body.classList.toggle('playing',state==='play');}
  /* nothing moves while paused or while a sheet covers the screen, so skip redrawing */
  if(state!=='pause'&&sheetKind===null)draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
mode=save.mode==='daily'?'daily':'free';
if(!save.owned.trail.includes(save.sel.trail))save.sel.trail='neon';
if(!save.owned.skin.includes(save.sel.skin))save.sel.skin='pearl';
window.tetherPause=function(){if(state==='play')setPause(true);};
window.tetherBack=function(){ if(!$('sheet').classList.contains('hide')){closeSheet();return true;}
  if(state==='play'){setPause(true);return true;} if(state==='pause'){setPause(false);return true;}
  if(state==='over'){showHome();return true;} return false; };
showHome();
requestAnimationFrame(frame);
})();
</script>
</body>
