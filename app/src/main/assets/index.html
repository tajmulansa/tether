  const bi=bestIdxNow();
  if(bi>0){
    for(const a of anchors){
      if(a.idx===bi&&!a.haz){
        ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.setLineDash([4,8]);ctx.lineWidth=1.2;
        ctx.beginPath();ctx.moveTo(-60,a.y);ctx.lineTo(FW+60,a.y);ctx.stroke();
        ctx.setLineDash([]);ctx.fillStyle='#fff';ctx.font='600 10.5px '+FONT;ctx.textAlign='left';
        ctx.fillText('BEST',12,a.y-7);ctx.restore();
      }
    }
  }

  const vTop=camY-90,vBot=camY+H+90;
  drawGlows(state==='home'?1:anchors.length,vTop,vBot);
  if(state!=='home'){
    if(wells.length)drawWells(vTop,vBot);
    if(MODS.wind)drawWind();
    drawItems(vTop,vBot);
    for(let i=0;i<anchors.length;i++){const a=anchors[i];if(a.y>vTop&&a.y<vBot)drawAnchor(a);}
  } else drawAnchor(anchors[0]);

  const p=player;
  if(p.latched&&state!=='over'){
    const a=p.latched;
    ctx.strokeStyle='hsla('+hue+',100%,80%,.15)';ctx.lineWidth=6;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  }
  drawAim();
  drawTrailPts(ctx,trail,save.sel.trail,hue,time,1);

  if(state!=='over'){
    const blink=run.invuln>0&&Math.floor(time*14)%2===0;
    const fade=(!p.latched&&state==='play')?clamp((p.flyDist-FLY_MAX*.62)/(FLY_MAX*.38),0,1):0;
    if(fade>0)ctx.globalAlpha=1-.7*fade*(.5+.5*Math.sin(time*(14+fade*22)));
    if(!blink)drawOrb(ctx,save.sel.skin,p.x,p.y,7,hue,time);
    ctx.globalAlpha=1;
    if(run.shield){
      ctx.strokeStyle='hsla(195,95%,72%,'+(.65+.25*Math.sin(time*6))+')';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.arc(p.x,p.y,15,0,6.283);ctx.stroke();
    }
  }

  ctx.globalCompositeOperation='lighter';
  for(const q of parts){ctx.globalAlpha=clamp(q.life/q.max,0,1);ctx.fillStyle=q.col;ctx.beginPath();ctx.arc(q.x,q.y,2.2,0,6.283);ctx.fill();}
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  for(const q of rings){
    ctx.globalAlpha=(1-q.t/.5)*.75;ctx.strokeStyle='hsl('+q.h+',100%,72%)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);ctx.stroke();
  }
  ctx.globalAlpha=1;

  ctx.textAlign='center';
  for(const q of popups){
    const al=Math.max(0,1-q.t/.9);ctx.globalAlpha=al;
    ctx.fillStyle='#fff';ctx.font='600 18px '+FONT;ctx.fillText(q.txt,q.x,q.y);
    if(q.sub){ctx.fillStyle='hsl('+q.h+',100%,76%)';ctx.font='600 11px '+FONT;ctx.fillText(q.sub,q.x,q.y+15);}
  }
  ctx.globalAlpha=1;

  if(flash>0){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(255,60,90,'+(flash*.45)+')';ctx.fillRect(0,0,cv.width,cv.height);}
}

/* ---------- loop ---------- */
let last=performance.now();
/* If the phone cannot keep up, draw at a lower resolution until it can (the picture stays sharp enough, the game stays smooth). */
let gAvg=16.7,gLast=0,gGood=0,gUps=0,bodyState='',lite=false,gBad=0,gOk=0;
function setLite(on){if(lite===on)return;lite=on;document.body.classList.toggle('lite',on);gBad=0;gOk=0;}
/* Adaptive quality: drops resolution fast when frames get slow (e.g. the phone's GPU path
   degrades after a notification or an ad), and gives some back when it runs smoothly again. */
function governor(now,raw){
  if(state!=='play'||document.hidden||raw>250)return;
  gAvg+=(raw-gAvg)*.08;
  const since=now-gLast;
  /* still slow at the lowest resolution: lite mode (no sky effects, fewer particles); back once it is smooth */
  if(!lite){if(renderScale<=.55&&gAvg>30){gBad+=raw;if(gBad>4000)setLite(true);}else gBad=0;}
  else{if(gAvg<20){gOk+=raw;if(gOk>12000){setLite(false);}}else gOk=0;}
  if(gAvg>24&&since>1500&&renderScale>.52){
    renderScale=Math.max(.5,renderScale*(gAvg>40?.68:.85));gLast=now;gAvg=16.7;gGood=0;resize();
  }else if(gAvg<18.5&&renderScale<1&&gUps<8){
    gGood+=raw;
    if(gGood>8000&&since>8000){renderScale=Math.min(1,renderScale*1.2);gLast=now;gGood=0;gUps++;resize();}
  }else gGood=0;
}
/* coming back from a notification shade, another app or an ad: reset timing and re-create the canvas buffer */
function wake(){
  last=performance.now();gAvg=16.7;gGood=0;gLast=performance.now();
  renderScale=1;gUps=0;setLite(false);resize();
  try{if(AC&&AC.state!=='running'&&!document.hidden)AC.resume();}catch(e){}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wake();});
addEventListener('focus',function(){wake();});
/* a call, notification pop-up or the shade steals focus without hiding the page: pause the run */
addEventListener('blur',function(){if(state==='play')setPause(true);});
let mN=0,mW=0,mS=0,mT=0;
function frame(now){
  /* 120 Hz phones: render every other refresh (about 60 fps) so each frame has twice the time */
  if(now-last<10.5){requestAnimationFrame(frame);return;}
  const raw=now-last;let real=raw/1000;last=now;
  if(real>.033)real=.033;
  if(state!=='pause'){
    let ts=1;if(slowT>0){ts=.4;slowT-=real;}
    update(real*ts,real);
  }
  governor(now,raw);
  if(save.set.fps){
    mN++;if(raw>mW)mW=raw;if(raw>34)mS++;
    if(now-mT>=1000){
      const el=$('fpsm');el.classList.remove('hide');
      el.textContent=Math.round(mN*1000/(now-mT))+' fps · worst '+Math.round(mW)+' ms · hitches '+mS+' · scale '+renderScale.toFixed(2)+' · dpr '+(window.devicePixelRatio||1).toFixed(2)+(Ads.has()?' · ads: '+(adLog||'-'):'');
      mN=0;mW=0;mS=0;mT=now;
    }
  }
  if(state!==bodyState){bodyState=state;document.body.classList.toggle('playing',state==='play');Ads.sync();}
  /* nothing moves while paused or while a sheet covers the screen, so skip redrawing */
  if(state!=='pause')draw();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
if(!save.owned.trail.includes(save.sel.trail))save.sel.trail='neon';
if(!save.owned.skin.includes(save.sel.skin))save.sel.skin='pearl';
window.tetherPause=function(){if(state==='play')setPause(true);};
window.tetherBack=function(){ if(setOpen){closeSettings();return true;}
  if(shopOpen){closeShop();return true;}
  if(state==='ready')return true;
  if(state==='clear'){clearHome();return true;}
  if(state==='play'){setPause(true);return true;} if(state==='pause'){setPause(false);return true;}
  if(state==='over'){if(revOpen){closeRev();return true;}showHome();return true;} return false; };
showHome();
requestAnimationFrame(frame);
/* ---- loading screen: shows from the very first paint, leaves once the game has drawn a few frames ---- */
(function(){
  const t0=window.__t0||0;let n=0;
  function done(){Ads.bootDone=true;Ads.sync();const b=document.getElementById('boot');if(!b)return;b.classList.add('out');setTimeout(function(){b.remove();},520);}
  /* in the app, the loading screen also waits for the ad system's first loading round (its set-up is what
     used to stutter the home screen), but never longer than 4.5 s */
  const adsBoot=Ads.has()?new Promise(function(r){window.tetherAdsBoot=function(){setTimeout(r,350);};setTimeout(r,4500);}):Promise.resolve();
  function ready(){
    const wait=Math.max(0,1100-(performance.now()-t0));
    const f=(document.fonts&&document.fonts.ready)?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,1800)})]):Promise.resolve();
    Promise.all([f,adsBoot]).then(function(){setTimeout(done,wait);});
  }
  (function w(){if(++n<4){requestAnimationFrame(w);return;}ready();})();
  /* get the heavy one-time work out of the way while the loader is showing */
  setTimeout(function(){try{prewarm(ZONES[0].h);glowSprite(ZONES[0].h);}catch(e){}},60);
  setTimeout(function(){try{if(!AC){AC=makeCtx();if(AC)buildAudio();}}catch(e){}},500);
})();
})();
</script>
