<!DOCTYPE html>
<html lang="en">
<head>
<script>window.__t0=performance.now();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<title>Ozmora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --acc:hsl(232,90%,72%);
  --acc2:hsl(282,85%,66%);
  --ink:#05060f;
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(255,255,255,.22);
  --surface:rgba(255,255,255,.04);
  --surface-hi:rgba(255,255,255,.08);
  --tx:#f4f6ff;
  --mut:rgba(244,246,255,.56);
  --faint:rgba(244,246,255,.32);
  --gold:#ffd166;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--ink)}
html,body{
  margin:0;height:100%;overflow:hidden;color:var(--tx);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
/* background lives in a CSS layer (composited by the GPU), so the canvas only draws the game */
#bgl{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#05060f}
#bgl .bl{position:absolute;inset:0;opacity:0;transition:opacity 2.2s ease;
  background:radial-gradient(circle at 22% 14%,var(--g0,rgba(60,60,160,.2)),transparent 58%),radial-gradient(circle at 78% 52%,var(--g1,rgba(90,40,150,.2)),transparent 62%),radial-gradient(circle at 28% 92%,var(--g2,rgba(40,80,160,.2)),transparent 66%),linear-gradient(180deg,var(--b1,#05060f),var(--b2,#10122a))}
#bgl .bl.on{opacity:1}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-appearance:none;padding:0;transition:transform .2s var(--ease),background .25s ease,color .25s ease,opacity .25s ease,box-shadow .3s ease}
button:focus-visible{outline:1px solid var(--acc);outline-offset:4px;border-radius:4px}
button:active{transform:scale(.97)}
.hide{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(2,3,10,.65) 100%)}

/* ---------- shared pieces ---------- */
.shard{
  display:inline-block;width:8px;height:8px;border-radius:1.5px;
  background:linear-gradient(135deg,#fff3b0,#ffb703);transform:rotate(45deg);flex:none;
  box-shadow:0 0 10px rgba(255,209,102,.5);
}
.chip{display:inline-flex;align-items:center;gap:10px;font-weight:300;font-size:15px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.chip b{font-weight:400}
.ibtn{width:44px;height:44px;display:grid;place-items:center;color:var(--tx);opacity:.72;pointer-events:auto}
.ibtn:hover{opacity:1}

.btn{
  pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  height:52px;padding:0 34px;width:100%;max-width:250px;border-radius:26px;
  font-size:12px;font-weight:600;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;
  color:var(--ink);background:var(--tx);
  box-shadow:0 14px 36px -12px rgba(0,0,0,.6);
  box-shadow:0 14px 40px -12px color-mix(in srgb,var(--acc) 60%,transparent);
}
.btn:hover{background:#fff}
.btn.ghost{
  height:48px;color:var(--tx);background:transparent;
  box-shadow:inset 0 0 0 1px var(--line-hi);font-weight:500;
}
.btn.ghost:hover{background:var(--surface-hi)}
.link{
  pointer-events:auto;color:var(--mut);font-size:11px;font-weight:500;
  letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;padding:14px 16px;
}
.link:hover{color:var(--tx)}

/* ---------- screens ---------- */
.screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--st) + 22px) 24px calc(var(--sb) + 18px);
  transition:opacity .4s var(--ease),visibility .4s;
}

/* HOME: the playfield is the menu. Type floats above the orbiting orb. */
#home{background:linear-gradient(180deg,rgba(3,4,12,.6) 0,transparent 30%,transparent 58%,rgba(3,4,12,.7) 100%)}
#home>*{pointer-events:none}
#home button{pointer-events:auto}
.rv{transition:opacity .9s var(--ease) var(--d,0s),transform .9s var(--ease) var(--d,0s)}
#home.hide .rv{opacity:0;transform:translateY(10px)}
#bPlay{position:absolute;inset:0;z-index:0;width:100%;height:100%;cursor:pointer}
#bPlay:active{transform:none}
#bPlay .tap{
  position:absolute;left:0;right:0;bottom:calc(var(--sb) + 64px);text-align:center;
  font-size:11px;font-weight:500;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--tx);
  animation:breathe 2.6s ease-in-out infinite;
}
#bPlay .tap::after{
  content:"";display:block;width:1px;height:26px;margin:14px auto 0;
  background:linear-gradient(180deg,var(--acc),transparent);transform-origin:top;animation:drip 2.6s ease-in-out infinite;
}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
#home .top,#home .title,#home .bottom{position:relative;z-index:1;width:100%;max-width:440px}
#home .top{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
/* zone progress: one tick per level of the zone; lit once cleared, outlined for the one selected */
.zprog{display:flex;gap:6px}
.zprog i{display:block;width:22px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .4s ease,box-shadow .4s ease}
.zprog i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.zprog i.cur:not(.on){background:rgba(255,255,255,.5)}
.zone-tag{
  display:inline-flex;align-items:center;gap:10px;font-size:10.5px;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--mut);
}
.zone-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.title{margin-top:8vh;display:flex;flex-direction:column;align-items:center}
.wm{margin:0;display:flex;align-items:center;font-size:36px;font-weight:200;letter-spacing:.32em;line-height:1;text-transform:uppercase;color:var(--tx)}
.wm span{margin-right:-.32em}
.omark{width:31px;height:31px;margin-right:.12em;overflow:visible}
.omark .ring{fill:none;stroke:var(--tx);stroke-opacity:.38;stroke-width:1.3}
.omark .core{fill:var(--tx)}
.omark .orb{transform-origin:17px 17px;transform-box:view-box;animation:spin 4s linear infinite;fill:var(--acc);filter:drop-shadow(0 0 5px var(--acc))}
@keyframes spin{to{transform:rotate(360deg)}}
.bestbox{margin-top:34px;text-align:center}
.bestbox b{display:block;font-size:40px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bestbox span{display:block;margin-top:10px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase}
#home .bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:6px}
@keyframes breathe{50%{opacity:.35}}

/* HUD: just a score, a hairline of progress, and the things that matter right now */
#hud{
  position:fixed;top:0;bottom:0;left:50%;width:min(100%,480px);transform:translateX(-50%);pointer-events:none;
  display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto 1fr;
  padding:calc(var(--st) + 14px) 22px 20px;transition:opacity .3s;
}
#hud #bPause{justify-self:start;align-self:start;margin:6px 0 0 -12px}
#hud #hCoins{justify-self:end;align-self:start;margin-top:18px}
#hMid{text-align:center;min-width:130px}
#hScore{
  font-size:68px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:0 0 36px rgba(255,255,255,.18);transition:transform .25s var(--ease);
}
#hScore.pop{transform:scale(1.12)}
#hZone{margin-top:8px;font-size:10px;font-weight:600;letter-spacing:.3em;text-indent:.3em;text-transform:uppercase;color:var(--mut)}
#hBar{width:84px;height:1px;background:rgba(255,255,255,.14);margin:9px auto 0;position:relative}
#hBarFill{position:absolute;left:0;top:0;height:1px;width:0;background:var(--acc);box-shadow:0 0 10px var(--acc),0 0 2px var(--acc);transition:width .35s var(--ease)}
#hTgt{margin-top:8px;font-size:9.5px;font-weight:600;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;color:var(--faint);text-align:center;transition:color .3s}
#hTgt.gold{color:var(--gold)}
#chips{grid-column:1/4;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:14px;min-height:16px}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);animation:pillIn .35s var(--ease) both}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.pill.combo{color:var(--acc)}
.pill.sh{color:hsl(195,95%,76%)}
.pill.sg{color:hsl(322,95%,80%)}
@keyframes pillIn{from{opacity:0;transform:translateY(-4px)}}
#hint{
  grid-column:1/4;align-self:end;justify-self:center;margin-bottom:11vh;text-align:center;max-width:240px;
  font-size:10.5px;font-weight:500;letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;line-height:1.9;color:var(--mut);
  animation:breathe 2.6s ease-in-out infinite;transition:opacity .3s;
}
#hint::before{content:"";display:block;width:36px;height:36px;margin:0 auto 16px;border-radius:50%;border:1px solid var(--line-hi);animation:ripple 2.6s ease-out infinite}
@keyframes ripple{0%{transform:scale(.45);opacity:.9}100%{transform:scale(1.4);opacity:0}}

/* RUN OVER / REVIVE / PAUSE: quiet, centred, one primary action */
#over,#pause,#rev,#clr,#set,#shop{
  justify-content:center;
  background:radial-gradient(ellipse at 50% 42%,rgba(5,6,16,.5),rgba(3,4,10,.92));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.ovwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px;transition:opacity .6s var(--ease) .12s,transform .7s var(--ease) .12s}
.screen.hide .ovwrap{opacity:0;transform:translateY(14px)}
#pause .ovwrap{gap:12px}
.ovtag{font-size:10.5px;font-weight:600;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:14px}
.ovtag.gold{color:var(--gold);text-shadow:0 0 22px rgba(255,209,102,.5)}
#rvScore,#ovScore{font-size:120px;font-weight:200;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:6px}
#rvScore{font-size:88px}
#ovBest,.rvsub{color:var(--mut);font-size:10.5px;font-weight:500;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;margin-top:4px}
#ovBar{width:150px;height:1px;background:rgba(255,255,255,.14);margin:16px 0 10px;position:relative}
#ovBar i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--tx);transition:width 1s var(--ease) .3s}
#ovBar.gold i{background:var(--gold);box-shadow:0 0 12px var(--gold)}
#ovEarn{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px;min-height:14px}
.acts{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.links{display:flex;align-items:center;gap:2px}
.links .sep{width:1px;height:12px;background:var(--line-hi)}
#bRevive.no{opacity:.4}
.adbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px}
.adbtn svg{width:12px;height:12px;flex:none}
.adbtn.hide,#bRevive.hide,#rvTimer.hide{display:none!important}
#rvTimer{width:150px;height:1px;background:rgba(255,255,255,.14);overflow:hidden;margin:20px 0 22px}
#rvTimer i{display:block;height:1px;width:100%;background:var(--gold);box-shadow:0 0 10px var(--gold);transform-origin:left center}
#rvTimer.low i{background:#ff5a6a;box-shadow:0 0 10px #ff5a6a}

/* level select (home) + level clear */
.lvsel{display:flex;align-items:center;justify-content:center;gap:14px}
.lvsel b{min-width:72px}
.lvarr{width:44px;height:44px;display:grid;place-items:center;color:var(--tx);opacity:.6;pointer-events:auto}
.lvarr:hover{opacity:1}
.lvarr svg{width:18px;height:18px}
.lvarr.off{opacity:.12;cursor:default}
.mstars{display:flex;gap:8px;justify-content:center;margin-top:14px;height:13px}
.mstars svg{width:13px;height:13px;color:rgba(255,255,255,.16)}
.mstars svg.on{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,209,102,.55))}
.stars{display:flex;gap:14px;margin:8px 0 4px}
.star{display:block;width:34px;height:34px;color:rgba(255,255,255,.14);transform:scale(.6);opacity:.5;transition:transform .6s var(--ease),opacity .4s ease,color .4s ease,filter .4s ease}
.star svg{display:block;width:100%;height:100%}
.star.on{color:var(--gold);opacity:1;transform:none;filter:drop-shadow(0 0 10px rgba(255,209,102,.6))}
#clScore{font-size:84px;font-weight:200;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-top:2px}
#clSub{color:var(--mut);font-size:10.5px;font-weight:500;letter-spacing:.24em;text-indent:.24em;text-transform:uppercase;margin-top:4px}
.goals{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin:18px 0 8px}
.goal{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
.goal::before{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px currentColor;flex:none}
.goals.c{align-items:center;margin:16px 0 0}
.goal.ok{color:var(--gold)}
.goal.ok::before{background:currentColor;box-shadow:0 0 10px currentColor}
#clEarn{display:flex;align-items:center;gap:10px;color:var(--gold);font-weight:400;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin:6px 0 20px;min-height:14px}

/* settings */
.gear{position:absolute;top:calc(var(--st) + 12px);right:12px;width:44px;height:44px;display:grid;place-items:center;color:var(--tx);opacity:.55;pointer-events:auto;z-index:2}
.gear:hover{opacity:1}
.gear svg{width:20px;height:20px}
.srows{display:flex;flex-direction:column;width:100%;margin:14px 0 18px}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);text-align:left;pointer-events:auto}
.srow.on{color:var(--tx)}
.sw{position:relative;width:38px;height:20px;border-radius:10px;background:rgba(255,255,255,.12);flex:none;transition:background .25s ease}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;opacity:.7;transition:transform .3s var(--ease),opacity .25s}
.srow.on .sw{background:var(--acc)}
.srow.on .sw::after{transform:translateX(18px);opacity:1}

/* store */
.gear.l{right:auto;left:12px}
.gear.dot::after{content:"";position:absolute;top:9px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.shopwrap{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:340px;flex:1;min-height:0;transition:opacity .6s var(--ease) .12s,transform .7s var(--ease) .12s}
.screen.hide .shopwrap{opacity:0;transform:translateY(14px)}
.shophead{display:flex;align-items:center;justify-content:space-between;width:100%}
.shophead .link{padding-left:0;text-indent:0}
#shopPrev{width:100%;flex:1 1 132px;min-height:132px;max-height:240px;border-radius:16px;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.tabs{display:flex;gap:6px;width:100%}
.tab{flex:1;height:38px;border-radius:19px;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-indent:.2em;text-transform:uppercase;color:var(--mut);pointer-events:auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.tab.on{color:var(--ink);background:var(--tx);box-shadow:none}
.sgrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(62px,100px);gap:8px;width:100%;align-content:start;flex:4 1 0;min-height:96px;overflow-y:auto}
.sitem{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;text-align:left;background:rgba(255,255,255,.025);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.sitem.sel{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--acc)}
.sitem canvas{width:44px;height:44px;flex:none}
.sitem .nm{display:block;font-size:12px;font-weight:500;letter-spacing:.05em;color:var(--tx)}
.sitem .st{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.sitem .st.own{color:var(--faint)}
.sitem.eq .st{color:var(--acc)}
.btn.no{opacity:.45}

/* loading */
#boot{position:fixed;inset:0;z-index:60;background:#05060f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;transition:opacity .5s ease}
#boot.out{opacity:0;pointer-events:none}
.bo{position:relative;width:84px;height:84px}
.bo i{position:absolute;display:block}
.bo .r{inset:0;border-radius:50%;border:1px solid rgba(143,162,255,.3)}
.bo .c{left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 24px 4px rgba(143,162,255,.55)}
.bo .o{inset:0;animation:boSpin 1.2s linear infinite;will-change:transform}
.bo .o::before{content:'';position:absolute;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#8fa2ff;box-shadow:0 0 16px 3px rgba(143,162,255,.8)}
.bt{font-size:11px;font-weight:300;letter-spacing:.6em;text-indent:.6em;color:rgba(200,208,255,.55);animation:boFade 1.8s ease-in-out infinite}
@keyframes boSpin{to{transform:rotate(360deg)}}
@keyframes boFade{50%{opacity:.3}}

/* zone atmosphere layers (opacity-only fades) */
/* performance meter (Settings) */
#fpsm{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);transform:translateX(-50%);z-index:60;pointer-events:none;font:500 10px/1.35 ui-monospace,Menlo,monospace;letter-spacing:.04em;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px;max-width:94vw;text-align:center}
/* glass blur re-computes every frame over the live canvas: off while playing; lite mode drops the sky effects */
body.playing *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
body.lite #fxl{display:none}
#fxl{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#fxl .fx{position:absolute;opacity:0;visibility:hidden;transition:opacity 2.2s ease,visibility 0s 2.2s}
#fxl[data-z="1"] .fa,#fxl[data-z="6"] .fd,#fxl[data-z="7"] .fh{opacity:1;visibility:visible;transition:opacity 2.2s ease}
#fxl .fa{inset:0 -30%;background:repeating-linear-gradient(100deg,transparent 0 40px,rgba(70,255,190,.11) 72px,rgba(110,190,255,.08) 100px,transparent 140px);-webkit-mask:linear-gradient(180deg,#000 0,transparent 72%);mask:linear-gradient(180deg,#000 0,transparent 72%);animation:fxSlide 26s ease-in-out infinite alternate}
#fxl .fh{width:170vw;height:170vw;left:-35vw;top:-18vh;border-radius:50%;background:conic-gradient(from 0deg,transparent 0,rgba(255,80,150,.26) 14%,transparent 34%,rgba(255,170,90,.17) 58%,transparent 80%);-webkit-mask:radial-gradient(circle,transparent 16%,#000 22%,#000 30%,transparent 56%);mask:radial-gradient(circle,transparent 16%,#000 22%,#000 30%,transparent 56%);animation:fxSpin 46s linear infinite}
#fxl .fd{inset:0;background:radial-gradient(ellipse at 50% 58%,transparent 16%,rgba(0,0,8,.8) 100%)}
#fxl .fx.fs{inset:0;background:rgba(255,246,190,.34);visibility:visible;opacity:0;transition:none}
#fxl .fx.fs.on{animation:fxFlash .6s ease-out}
@keyframes fxSlide{to{transform:translateX(18%)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxFlash{0%{opacity:0}10%{opacity:1}28%{opacity:.15}42%{opacity:.7}100%{opacity:0}}

/* zone title card: cinematic, centred, brief */
#zbn{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 15vh);text-align:center;pointer-events:none;opacity:0;padding:0 24px}
#zbn.show{animation:zbIn 2.2s var(--ease) both}
#zbn.bye{animation:zbOut .3s ease both}
@keyframes zbOut{from{opacity:.85}to{opacity:0}}
#zbn small{display:flex;align-items:center;justify-content:center;gap:16px;font-size:10px;font-weight:600;letter-spacing:.4em;text-transform:uppercase;color:var(--mut)}
#zbn small::before,#zbn small::after{content:"";width:32px;height:1px;background:currentColor;opacity:.4}
#zbn b{display:block;margin:10px 0 0;font-size:20px;font-weight:200;letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;color:var(--zc,#fff);opacity:.85}
#zbn span{display:block;font-size:12px;font-weight:300;letter-spacing:.12em;color:var(--tx);opacity:.72}
#zbn em{display:none;margin-top:18px;font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
@keyframes zbIn{0%{opacity:0;transform:translateY(12px);letter-spacing:.1em}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
#rdy{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:120px;font-weight:100;line-height:1;pointer-events:none;color:#fff;text-shadow:0 0 50px rgba(255,255,255,.35)}
#rdy small{display:block;margin-top:14px;font-size:10px;font-weight:600;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--mut);text-shadow:none}

#toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 84px);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:9}
.toast{
  padding:8px 18px;border-radius:20px;background:rgba(6,8,20,.78);
  font-weight:500;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx);

}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}12%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}

body.playing .chip,body.playing .ibtn,body.playing .pill,body.playing #hint,body.playing .toast{
  backdrop-filter:none!important;-webkit-backdrop-filter:none!important;
}

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const FW=400,FONT='"Plus Jakarta Sans",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif';
let S=1,H=640,offX=0;
let renderScale=1;   /* lowered automatically on slow phones (see governor) */
function resize(){
  let d=Math.max(.7,Math.min(window.devicePixelRatio||1,2)*renderScale);
  /* never push more than ~1.1 million pixels per frame, whatever the screen is */
  d=Math.min(d,Math.sqrt(1100000/Math.max(1,innerWidth*innerHeight)));
  cv.width=Math.floor(innerWidth*d);cv.height=Math.floor(innerHeight*d);
  S=Math.min(cv.width/FW,cv.height/600);
  H=cv.height/S;
  offX=(cv.width/S-FW)/2;
}
addEventListener('resize',resize);resize();

/* ---------- helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function fmtTime(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'m':m+'m '+(s%60)+'s';}
function resetIn(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);const s=Math.floor((m-n)/1000);return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m';}

/* ---------- save data ---------- */
const DEF=()=>({v:2,coins:0,bestAll:0,best:0,bestIdx:0,
  owned:{trail:['neon'],skin:['pearl']},sel:{trail:'neon',skin:'pearl'},
  stats:{runs:0,latches:0,shards:0,perfects:0,bestCombo:0,time:0,powerups:0},ach:{},
  lvl:{cur:1,max:1,stars:{},bp:{},bi:{}},missions:{day:0,list:[]},disc:{0:1},streak:{last:0,n:0},set:{sfx:1,music:1,haptic:1,shake:1,guide:1,fps:0}});
function merge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])&&t[k]&&typeof t[k]==='object')merge(t[k],s[k]);else t[k]=s[k];}}
function loadSave(){const d=DEF();try{const r=JSON.parse(localStorage.getItem('tether_v2')||'null');if(r)merge(d,r);}catch(e){}return d;}
let save=loadSave();
function persist(){try{localStorage.setItem('tether_v2',JSON.stringify(save));}catch(e){}}
/* level the player has selected (always between 1 and the highest unlocked level) */
let curLevel=Math.max(1,Math.min((save.lvl.cur|0)||1,(save.lvl.max|0)||1));

/* ---------- content tables ---------- */
/* The voyage: eight themed worlds (LPW levels each), then it loops with every earlier challenge mixed back in. Every world introduces one new challenge (m) and its own atmosphere (amb). */
const LPW=5;   /* levels per world; the last level of a world is its gauntlet */
const MECHS=['drift','crumble','well','wind','pulse','dark','horizon'];   /* the challenge introduced by worlds 2..8, in order */
function levelSeed(n){return ((Math.imul(n,2654435761)^0x9e3779b9)>>>0);}
/* Everything about a level comes from its number alone, so a level is the same every time it is played (learn it, master it, chase the stars)
   and difficulty only ever depends on how far the player has come. */
function levelDef(n){
  const t=n-1,w=Math.floor(t/LPW),k=t%LPW,gaunt=(k===LPW-1),mile=(n%10===0);
  const zi=w%ZONES.length,loop=Math.floor(w/ZONES.length),prim=ZONES[zi].m;
  const r=mulberry32(n*7919+13);
  const mods={};
  /* the world's own challenge eases in over its five levels */
  if(prim)mods[prim]=Math.min(1.15,(.6+.1*k)*(1+.08*loop));
  /* challenges from earlier worlds resurface, gently at first, more often the deeper the player goes */
  const pool=(loop>0?MECHS.slice():MECHS.slice(0,Math.max(0,w-1))).filter(function(m){return m!==prim;});
  let extra=0;
  if(w>=2&&k>=2)extra++;
  if(gaunt&&w>=4)extra++;
  if(mile&&w>=2)extra++;
  if(loop>=1&&k>=1)extra++;
  if(loop>=2)extra++;
  extra=Math.min(extra,3,pool.length);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const q=pool[i];pool[i]=pool[j];pool[j]=q;}
  for(let i=0;i<extra;i++){const m=pool[i];mods[m]=(m==='dark'||m==='wind')?.35+r()*.15:.4+r()*.2;}
  return {n:n,t:t,w:w,k:k,gaunt:gaunt,mile:mile,zi:zi,loop:loop,prim:prim,mods:mods,
    L:Math.min(34,8+Math.floor(t*.5))+(gaunt?3:0)+(mile?3:0),           /* anchors to the gate */
    gap:Math.min(236,122+t*2.6),                             /* average vertical distance between anchors */
    spread:Math.min(180,64+t*2.6),                           /* how far sideways the layout may wander */
    ampP:clamp((t-2)*.018,0,.55),                            /* share of anchors that swing */
    vanP:clamp((t-9)*.011,0,.32),                            /* share of anchors that crumble */
    hazFrom:4,
    hazP:(n<=2?0:clamp(.06+(t-2)*.012,0,.55))+(gaunt&&n>2?.08:0)+(mile?.06:0),  /* chance of a hazard in a gap */
    pairP:clamp((t-12)*.012,0,.4),                           /* chance of a second hazard, forming a narrow corridor */
    hazMv:clamp((t-12)*.01,0,.5),                            /* share of hazards that swing */
    scroll:14+Math.min(40,t*.5)};                            /* how fast the view climbs on its own */
}
/* ---------- zone identity ----------
   A zone's name and colour are pure functions of its number (fixed seeds and integer maths only), so Zone 9 is the same place on every device.
   Names follow the way real exoplanet catalogues name a planet (Kepler-22 b, Gliese-12 b): an invented star name, a short number and a planet letter.
   Every name is different for the first 28,224 zones.
   Never change these tables or formulas once the game is out: that would rename every player's zones.
   Colour rules: neon-on-dark only (fixed saturation and lightness bands); never the lime/olive arc (60-137) and never hazard red (336-9), so hazards
   always stand out; each zone is at least 60 degrees from the previous one and (best effort, never under 11) 14 degrees from the last eight. */
const ZN_A=['Ard','Bel','Cor','Dun','Eld','Fen','Gal','Hal','Ist','Jor','Kel','Lev','Mer','Nor','Ost','Pel','Quil','Rav','Sor','Tav','Ulm','Val','Wren','Yor'];
const ZN_B=['an','ane','ek','en','ia','ic','is','ix','on','or','os','ra','ren','ri','sa','th','um','us','wick','mere','ford','dale','vik','tis'];
const ZN_M=24*24*49;   /* 28,224 different names: 576 invented star names x numbers 1-49 */
let znPerm=null;
function zoneName(w){
  if(!znPerm){   /* one fixed shuffle (integer maths only), so neighbouring zones never share a pattern */
    const r=mulberry32(0x0A3F9C71);znPerm=new Uint16Array(ZN_M);
    for(let k=0;k<ZN_M;k++)znPerm[k]=k;
    for(let k=ZN_M-1;k>0;k--){const j=Math.floor(r()*(k+1)),t=znPerm[k];znPerm[k]=znPerm[j];znPerm[j]=t;}
  }
  const m=znPerm[w%ZN_M],wi=m%576,num=Math.floor(m/576)+1;
  const r=mulberry32((Math.imul(w+1,0x9E3779B1)^0x5A17C0DE)|0);
  const pl='bcdefgh'.charAt(Math.floor(r()*r()*7));   /* planet letter, mostly b, c, d like real systems */
  return ZN_A[wi%24]+ZN_B[Math.floor(wi/24)]+'-'+num+' '+pl;
}
const zHues=[];
function zoneHue(w){
  while(zHues.length<=w){
    const i=zHues.length;
    if(i<ZONES.length){zHues.push(ZONES[i].h);continue;}
    let bq=-1,bh=0;
    for(let k=0;k<64;k++){
      const u=((i*0.6180339887498949+k*0.0713)%1)*248,h=Math.floor(u<50?u+10:u+88);
      let q=999;
      for(let j=Math.max(0,i-8);j<i;j++){const d=Math.abs(zHues[j]-h),dd=Math.min(d,360-d);q=Math.min(q,j===i-1?dd/4.3:dd);}
      if(q>bq){bq=q;bh=h;}
      if(q>=14)break;                                    /* good enough: 14+ degrees from the last eight, 60+ from the previous zone */
    }
    zHues.push(bh);
  }
  return zHues[w];
}
const zCache={};
function zoneInfo(w){
  let z=zCache[w];if(z)return z;
  const zi=w%ZONES.length,h=zoneHue(w);let bg;
  if(w<ZONES.length)bg=ZONES[w].bg;
  else{
    const r=mulberry32((Math.imul(w+1,0x85EBCA6B)^0x1B873593)|0),sg=r()<.5?1:-1,off=20+Math.floor(r()*26);
    let bh=(h+sg*off+360)%360;if(bh>=60&&bh<138)bh=(h-sg*off+360)%360;      /* the lower tint also stays out of the olive arc */
    bg=['hsl('+h+','+(50+Math.floor(r()*9))+'%,5%)','hsl('+bh+','+(50+Math.floor(r()*11))+'%,'+(13+Math.floor(r()*4))+'%)'];
  }
  return zCache[w]={w:w,n:zoneName(w),h:h,bg:bg,zi:zi,m:ZONES[zi].m,amb:ZONES[zi].amb,t:ZONES[zi].t};
}
function zoneLabel(z){return 'Zone '+(z.w+1)+' · '+z.n;}
function zoneReward(w){return 30+(w%8)*5;}                  /* shards for discovering a zone beyond the first eight */
function mileBonus(n){return Math.min(250,40+n*2);}          /* first-clear bonus of a milestone level */
function perfOf(D){return Math.ceil(D.L*.5);}                /* perfect releases needed for the third star */
function levelTag(D){
  if(D.n===1)return 'Reach the gate';
  if(D.mile)return 'Milestone · '+D.L+' anchors';
  if(D.gaunt)return 'Gauntlet · '+D.L+' anchors';
  if(D.k===0&&D.prim)return ZONES[D.zi].t;
  return 'Reach the gate · '+D.L+' anchors';
}
const ZONES=[
  {h:232,m:'',       amb:'star', t:'Where every orbit begins'},
  {h:162,m:'drift',  amb:'star', t:'Anchors drift on the solar wind'},
  {h:16, m:'crumble',amb:'ember',t:'Embers crumble. Do not linger'},
  {h:305,m:'well',   amb:'star', t:'Gravity wells bend your flight'},
  {h:196,m:'wind',   amb:'snow', t:'Cold winds push you sideways'},
  {h:52, m:'pulse',  amb:'star', t:'Hazards pulse with lightning',bg:['hsl(236,42%,6%)','hsl(44,58%,13%)']},
  {h:268,m:'dark',   amb:'none', t:'Light is scarce. Trust the dark'},
  {h:338,m:'horizon',amb:'star',t:'Everything falls inward'}];
const ZREW=[0,25,40,60,80,100,130,160];   /* shards for discovering each zone for the first time */
const TRAILS=[{id:'neon',n:'Neon',p:0},{id:'fire',n:'Inferno',p:150},{id:'rainbow',n:'Prism',p:400},{id:'stardust',n:'Stardust',p:700},{id:'plasma',n:'Plasma',p:1100}];
const SKINS=[{id:'pearl',n:'Pearl',p:0},{id:'ember',n:'Ember',p:200},{id:'halo',n:'Halo',p:450},{id:'gem',n:'Gem',p:700},{id:'eclipse',n:'Eclipse',p:1000}];
const PU={shield:{h:195,t:'Shield'},surge:{h:322,t:'Double score'}};
const REVIVE=100;
const FLY_MAX=560;   /* an orb that flies this far (px) without catching an anchor is lost */
const MPOOL=[
  {id:'score',max:1,vals:[12,22,35],txt:n=>'Score '+n+' in one run'},
  {id:'shards',max:0,vals:[15,30,55],txt:n=>'Collect '+n+' shards'},
  {id:'perfect',max:0,vals:[3,6,10],txt:n=>'Land '+n+' perfect releases'},
  {id:'combo',max:1,vals:[3,5,8],txt:n=>'Reach a x'+n+' combo'},
  {id:'runs',max:0,vals:[3,5,8],txt:n=>'Play '+n+' runs'},
  {id:'power',max:0,vals:[1,3,5],txt:n=>'Pick up '+n+' power-ups'},
  {id:'zone',max:1,vals:[2,3,4],txt:n=>'Reach zone '+n}];
function discCount(){return Object.keys(save.disc||{}).length;}

/* ---------- haptics, toast ---------- */
function vib(p){if(save.set.haptic&&navigator.vibrate){try{navigator.vibrate(p);}catch(e){}}}
function toast(t){
  const box=$('toasts');while(box.children.length>2)box.removeChild(box.firstChild);
  const d=document.createElement('div');d.className='toast';d.textContent=t;box.appendChild(d);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},2450);
}

/* ---------- audio ---------- */
/* Procedural sound: every effect and the music are synthesized in code (no asset files).
   Graph: sfx/music buses -> master -> compressor -> output, with one shared reverb and one shared echo.
   Kept deliberately light: short mono reverb, shared send buses, few nodes per sound, rate-limited rapid sounds. */
let AC=null,master=null,outN=null,SB=null,wetBus=null,MB=null,MG=null,padBus=null,mFilter=null,verbSend=null,delaySend=null,mVerb=null,mEcho=null,noiseBuf=null;
let aVoices=0,mTimer=null,mNext=0,mStep=0,mOn=false,mZone=0,mSlow=0,lastShardT=0;
const BPM=96,STEP=60/BPM/4,MUSIC_VOL=.7;
/* One key and chord loop per zone. pent = the scale used for melodies and for the SFX pitches,
   so sound effects always sit in the same key as the music. */
const MZ=[
  {root:45,pent:[0,3,5,7,10],prog:[[0,'m7'],[-4,'M7'],[3,'M7'],[-2,'M']]},   /* Nebula  A minor */
  {root:50,pent:[0,2,4,7,9], prog:[[0,'M7'],[7,'M'],[9,'m7'],[5,'M7']]},     /* Aurora  D major */
  {root:41,pent:[0,2,4,7,9], prog:[[0,'M7'],[4,'m7'],[5,'M7'],[7,'M']]},     /* Sunset  F major */
  {root:46,pent:[0,3,5,7,10],prog:[[0,'m7'],[-4,'M7'],[-2,'M'],[3,'M7']]},   /* Orchid  Bb minor */
  {root:48,pent:[0,2,4,7,9], prog:[[0,'M7'],[2,'M'],[-3,'m7'],[7,'M']]},     /* Glacier C major */
  {root:52,pent:[0,3,5,7,10],prog:[[0,'m7'],[3,'M7'],[-2,'M'],[-5,'M7']]},   /* Ion Storm E minor */
  {root:43,pent:[0,3,5,7,10],prog:[[0,'m7'],[-2,'M7'],[-4,'M7'],[-5,'m7']]}, /* The Hollow G minor */
  {root:47,pent:[0,3,5,7,10],prog:[[0,'m7'],[-3,'M7'],[-5,'M'],[2,'m7']]}    /* Event Horizon B minor */
];
const CHORD={m7:[0,3,7,10],M7:[0,4,7,11],M:[0,4,7,12]};
function mtof(m){return 440*Math.pow(2,(m-69)/12);}

function makeCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{return new C({latencyHint:'interactive'});}catch(e){}
  try{return new C();}catch(e){return null;}
}
function initAudio(){
  if(!AC){AC=makeCtx();if(AC)buildAudio();}
  if(AC&&AC.state==='suspended')AC.resume();
  if(AC)startMusic();
}
function buildAudio(){
  const c=AC;
  master=c.createGain();master.gain.value=.9;
  outN=c.createDynamicsCompressor();
  outN.threshold.value=-16;outN.knee.value=20;outN.ratio.value=4;outN.attack.value=.004;outN.release.value=.18;
  master.connect(outN);outN.connect(c.destination);
  /* reverb: short mono impulse response (cheap to run) */
  const len=Math.floor(c.sampleRate*1.1),ir=c.createBuffer(1,len,c.sampleRate),d=ir.getChannelData(0);
  for(let i=0;i<len;i++){const x=1-i/len;d[i]=(Math.random()*2-1)*x*x*Math.sqrt(x);}   /* decay shape x^2.5, cheap to generate */
  const conv=c.createConvolver();conv.buffer=ir;
  verbSend=c.createGain();
  const vlp=c.createBiquadFilter();vlp.type='lowpass';vlp.frequency.value=3800;
  const vOut=c.createGain();vOut.gain.value=.4;
  verbSend.connect(vlp);vlp.connect(conv);conv.connect(vOut);vOut.connect(master);
  /* echo: dotted eighth note, darker on every repeat */
  const dl=c.createDelay(1.5);dl.delayTime.value=STEP*3;
  const fb=c.createGain();fb.gain.value=.36;
  const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2400;
  const dOut=c.createGain();dOut.gain.value=.5;
  delaySend=c.createGain();
  delaySend.connect(dl);dl.connect(dlp);dlp.connect(fb);fb.connect(dl);dlp.connect(dOut);dOut.connect(master);
  /* sfx buses: SB = dry, wetBus = dry + reverb */
  SB=c.createGain();SB.gain.value=1;SB.connect(master);
  wetBus=c.createGain();wetBus.connect(master);
  const wv=c.createGain();wv.gain.value=.45;wetBus.connect(wv);wv.connect(verbSend);
  /* music buses */
  MG=c.createGain();MG.gain.value=0;MG.connect(master);            /* music on/off fade */
  mFilter=c.createBiquadFilter();mFilter.type='lowpass';mFilter.frequency.value=2600;mFilter.Q.value=.5;mFilter.connect(MG);
  MB=c.createGain();MB.gain.value=1;MB.connect(mFilter);            /* music level by game state */
  padBus=c.createGain();padBus.gain.value=1;padBus.connect(MB);    /* ducked by the kick (sidechain feel) */
  mVerb=c.createGain();mVerb.gain.value=0;mVerb.connect(verbSend); /* music reverb / echo sends (shared) */
  mEcho=c.createGain();mEcho.gain.value=0;mEcho.connect(delaySend);
  noiseBuf=c.createBuffer(1,Math.floor(c.sampleRate*.5),c.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  /* warm-up: push an inaudible blip through the reverb and echo now, so the first real sound does not pay their start-up cost */
  const wb=c.createBuffer(1,256,c.sampleRate),wd=wb.getChannelData(0);for(let i=0;i<256;i++)wd[i]=(Math.random()*2-1)*1e-5;
  const ws=c.createBufferSource();ws.buffer=wb;ws.connect(verbSend);ws.connect(delaySend);ws.start();
}

/* ----- voice helpers ----- */
function route(out,o){
  if(o.bus){
    out.connect(o.bus);
    if(o.verb)out.connect(mVerb);
    if(o.dly)out.connect(mEcho);
  } else out.connect(o.verb?wetBus:SB);
}
function voice(type,f,t,dur,peak,o){
  o=o||{};
  if(!AC||aVoices>(o.bus?28:40))return;   /* music notes give way before sound effects do */
  const osc=AC.createOscillator(),g=AC.createGain();
  osc.type=type;osc.frequency.setValueAtTime(f,t);
  if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.glide||dur));
  if(o.det)osc.detune.value=o.det;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g);
  let out=g;
  if(o.lp){const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(o.lp,t);
    if(o.lpTo)lp.frequency.exponentialRampToValueAtTime(o.lpTo,t+dur);g.connect(lp);out=lp;}
  route(out,o);
  aVoices++;osc.onended=function(){aVoices--;try{out.disconnect();}catch(e){}};
  osc.start(t);osc.stop(t+dur+.05);
}
function noise(t,dur,peak,o){
  o=o||{};
  if(!AC||aVoices>(o.bus?28:40))return;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const f=AC.createBiquadFilter(),g=AC.createGain();
  f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f0||1000,t);
  if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+dur);
  f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);route(g,o);
  aVoices++;s.onended=function(){aVoices--;try{g.disconnect();}catch(e){}};
  s.start(t,Math.random()*.4);s.stop(t+dur+.05);
}
function curZone(){return (mOn&&AC)?mZone:((typeof run!=='undefined'&&run&&run.zone)||0)%MZ.length;}
/* pitch from the current key's pentatonic scale; i can be any whole number (wraps up through octaves) */
function zNote(i,zIdx){
  const z=MZ[(zIdx===undefined?curZone():zIdx)%MZ.length],p=z.pent,n=p.length;
  return z.root+24+p[((i%n)+n)%n]+12*Math.floor(i/n);
}
function bell(m,t,vol,dur){
  const f=mtof(m);
  voice('sine',f,t,dur,vol*1.15,{a:.002,verb:.5});
  voice('sine',f*2.76,t,dur*.3,vol*.3,{a:.002,verb:.4});
}
function sfxOk(){return !!(AC&&save.set.sfx&&AC.state==='running');}
function T(){return AC.currentTime+.005;}

/* ----- sound effects ----- */
const sfx={
  tick(){if(!sfxOk())return;voice('sine',1700,T(),.04,.05,{a:.001,to:1100});},
  swoosh(up){if(!sfxOk())return;const t=T();noise(t,.2,.05,{f0:up?600:2400,f1:up?2400:600,q:1,a:.03,verb:.2});},
  start(){if(!sfxOk())return;const t=T();noise(t,.35,.09,{f0:300,f1:3500,q:.9,a:.15,verb:.4});bell(zNote(0),t+.12,.16,.9);bell(zNote(2),t+.19,.14,1);},
  pause(){if(!sfxOk())return;noise(T(),.3,.07,{f0:2500,f1:300,q:.8,a:.02,verb:.2});},
  resume(){if(!sfxOk())return;noise(T(),.3,.07,{f0:300,f1:2500,q:.8,a:.02,verb:.2});},
  release(){
    if(!sfxOk())return;const t=T();
    noise(t,.28,.13,{f0:500,f1:3400,q:1.2,a:.03,verb:.3});
    voice('sine',240,t,.2,.1,{to:640,a:.01});
  },
  latch(combo){
    if(!sfxOk())return;const t=T(),i=Math.min(combo,10);
    bell(zNote(i),t,.2,.75);
    if(combo>=2)bell(zNote(i+5),t+.045,.1,.55);
    voice('sine',175,t,.14,.26,{to:62,a:.002});
  },
  latchSoft(){if(!sfxOk())return;voice('sine',300,T(),.09,.1,{to:200,a:.002});},
  perfect(){
    if(!sfxOk())return;const t=T();
    bell(zNote(5),t,.15,.8);bell(zNote(7),t+.07,.15,.9);bell(zNote(10),t+.14,.13,1.1);
    noise(t,.35,.05,{type:'highpass',f0:6500,a:.02,verb:.5});
  },
  shard(s){
    if(!sfxOk())return;const t=T();
    if(t-lastShardT<.045)return;lastShardT=t;   /* collecting a cluster of shards: skip sounds that would overlap */
    const f=mtof(zNote(Math.min(s,9)+5));
    voice('sine',f,t,.16,.12,{a:.002,verb:.35});
    voice('triangle',f*2,t,.08,.04,{a:.001});
  },
  power(type){
    if(!sfxOk())return;const t=T();
    if(type==='shield'){
      [0,2,4,7].forEach((d,k)=>bell(zNote(d),t+k*.06,.13,.9));
      noise(t,.5,.06,{f0:800,f1:5000,q:.8,a:.15,verb:.5});
    } else {
      for(let k=0;k<5;k++)bell(zNote(k+3),t+k*.05,.11,.6);
      voice('triangle',mtof(zNote(5)),t+.25,.5,.08,{verb:.5});
    }
  },
  zone(){
    if(!sfxOk())return;const t=T();
    voice('sine',300,t,.6,.12,{to:1200,a:.2,verb:.4});
    noise(t,.7,.09,{f0:300,f1:6000,q:.7,a:.5,verb:.6});
    [0,2,4,5,7].forEach((d,k)=>bell(zNote(d,run.zone%MZ.length),t+.45+k*.08,.12,1.2));
  },
  near(){
    if(!sfxOk())return;const t=T();
    noise(t,.45,.1,{f0:3500,f1:300,q:1.5,a:.02});
    voice('sine',520,t,.35,.07,{to:180,a:.01});
    mSlow=AC.currentTime+.55;
  },
  shieldSave(){
    if(!sfxOk())return;const t=T();
    voice('sine',300,t,.35,.14,{to:900,a:.02,verb:.4});
    [0,2,4].forEach((d,k)=>bell(zNote(d+5),t+.18+k*.06,.11,.8));
  },
  shieldBreak(){
    if(!sfxOk())return;const t=T();
    noise(t,.28,.12,{type:'highpass',f0:5000,q:.6,a:.002,verb:.4});
    [2600,2000,1500].forEach((f,k)=>voice('triangle',f,t+k*.04,.18,.07,{to:f*.5,a:.002,verb:.4}));
  },
  die(){
    if(!sfxOk())return;const t=T();
    voice('sine',150,t,.7,.42,{to:32,a:.003});
    noise(t,.55,.22,{type:'lowpass',f0:2400,f1:150,q:.7,a:.004,verb:.4});
    voice('sawtooth',330,t,.6,.12,{to:70,a:.005,lp:1800,lpTo:200,verb:.3});
    voice('sawtooth',335,t,.6,.1,{to:72,a:.005,lp:1800,lpTo:200,det:12});
    mSlow=AC.currentTime+.9;
  },
  newBest(){
    if(!sfxOk())return;const t=T();
    [0,2,4,5,7,9,10].forEach((d,k)=>bell(zNote(d+3),t+k*.075,.14,1));
    noise(t+.3,.6,.05,{type:'highpass',f0:6000,a:.1,verb:.6});
  },
  revive(){
    if(!sfxOk())return;const t=T();
    voice('sine',220,t,.5,.14,{to:880,a:.1,verb:.4});
    [0,2,4,7].forEach((d,k)=>bell(zNote(d+5),t+.3+k*.06,.12,.9));
  },
  buy(){
    if(!sfxOk())return;const t=T();
    bell(zNote(7),t,.15,.7);bell(zNote(9),t+.08,.15,.9);bell(zNote(12),t+.16,.12,1.1);
    noise(t,.3,.04,{type:'highpass',f0:7000,a:.01,verb:.5});
  },
  claim(){
    if(!sfxOk())return;const t=T();
    bell(zNote(5),t,.14,.7);bell(zNote(7),t+.07,.14,.8);bell(zNote(10),t+.14,.12,1);
  },
  ach(){
    if(!sfxOk())return;const t=T();
    [0,2,4].forEach((d,k)=>bell(zNote(d+5),t+k*.09,.14,1.2));
  },
  error(){
    if(!sfxOk())return;const t=T();
    voice('triangle',170,t,.12,.2,{to:120,a:.002});
    voice('triangle',140,t+.11,.16,.2,{to:90,a:.002});
  }
};

/* ----- music: generative, reacts to the game ----- */
function startMusic(){
  if(!AC||!save.set.music||mOn)return;
  mOn=true;mNext=AC.currentTime+.08;mStep=0;
  MG.gain.cancelScheduledValues(AC.currentTime);
  MG.gain.setValueAtTime(MG.gain.value,AC.currentTime);
  MG.gain.linearRampToValueAtTime(MUSIC_VOL,AC.currentTime+1.8);
  mTimer=setInterval(mSched,30);
}
function stopMusic(){
  mOn=false;
  if(mTimer){clearInterval(mTimer);mTimer=null;}
  if(AC&&MG){
    const n=AC.currentTime;
    MG.gain.cancelScheduledValues(n);MG.gain.setValueAtTime(MG.gain.value,n);MG.gain.linearRampToValueAtTime(0,n+.4);
    mVerb.gain.setTargetAtTime(0,n,.15);mEcho.gain.setTargetAtTime(0,n,.15);
  }
}
function mSched(){
  if(!AC||!mOn)return;
  if(AC.state!=='running'){mNext=AC.currentTime+.1;return;}
  if(mNext<AC.currentTime-.5)mNext=AC.currentTime+.05;
  const lim=AC.currentTime+.14;
  while(mNext<lim){mStepAt(mStep,mNext);mNext+=STEP;mStep++;}
}
/* 0 = calm (menu, pause, game over), 1 = playing, 2 = building, 3 = full */
function mIntensity(){
  if(state!=='play')return 0;
  if(!run.started)return 1;
  const sc=run.score||0,cb=run.combo||0;
  let v=1;if(sc>=8||cb>=3)v=2;if(sc>=22||cb>=6)v=3;
  return v;
}
function mControl(t,inten){
  let cut=7000+inten*1400,lvl=1;
  if(state==='home'){cut=2600;lvl=.9;}
  else if(state==='pause'){cut=650;lvl=.55;}
  else if(state==='over'){cut=900;lvl=.7;}
  if(AC.currentTime<mSlow)cut=Math.min(cut,900);
  mFilter.frequency.setTargetAtTime(cut,t,.12);
  MB.gain.setTargetAtTime(lvl,t,.25);
  mVerb.gain.setTargetAtTime(.4*lvl,t,.25);
  mEcho.gain.setTargetAtTime(.45*lvl,t,.25);
}
function padNote(m,t,dur,vol){
  const f=mtof(m),g=AC.createGain(),lp=AC.createBiquadFilter();
  lp.type='lowpass';lp.Q.value=.6;
  lp.frequency.setValueAtTime(500,t);lp.frequency.linearRampToValueAtTime(1500,t+dur*.5);lp.frequency.linearRampToValueAtTime(700,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+1.2);g.gain.setValueAtTime(vol,t+dur-1.4);g.gain.linearRampToValueAtTime(.0001,t+dur);
  g.connect(lp);lp.connect(padBus);lp.connect(mVerb);
  for(let k=0;k<2;k++){
    const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=k?9:-9;o.connect(g);
    aVoices++;
    o.onended=function(){aVoices--;if(k){try{g.disconnect();lp.disconnect();}catch(e){}}};
    o.start(t);o.stop(t+dur+.05);
  }
}
function mPluck(m,t,vol){
  voice('triangle',mtof(m),t,.42,vol*1.1,{a:.003,bus:MB,lp:3400,lpTo:900,verb:1,dly:1});
}
function mStepAt(step,t){
  const pos=step%32,p=step%16;
  if(pos===0)mZone=((state==='home')?0:(run.zone||0))%MZ.length;
  const Z=MZ[mZone],pr=Z.prog[Math.floor(step/32)%4],rootM=Z.root+pr[0],ch=CHORD[pr[1]];
  const inten=mIntensity();
  if(step%4===0)mControl(t,inten);

  /* pad: one chord every two bars; the four notes start on consecutive steps so the work is spread out */
  if(pos<4){
    const dur=(32-pos)*STEP+1.4,v=.03;
    if(pos===0)padNote(rootM,t,dur,v);
    else padNote(rootM+12+ch[pos],t,dur,v*.85);
  }

  /* bass */
  let hit=false;
  if(inten===1)hit=(p===0);
  else if(inten===2)hit=(p===0||p===6||p===10);
  else if(inten>=3)hit=(p===0||p===3||p===6||p===10||p===14);
  if(hit){
    const f=mtof(rootM+((p===10||p===14)?7:0));
    voice('sine',f,t,.38,.2,{a:.008,bus:padBus});
    voice('triangle',f*2,t,.22,.07,{a:.008,bus:padBus,lp:900});
  }

  /* melody: chord tones in two octaves */
  const tones=[];
  for(let k=0;k<4;k++)tones.push(rootM+12+ch[k]);
  for(let k=0;k<4;k++)tones.push(rootM+24+ch[k]);
  if(inten===0){
    if(p===0&&Math.random()<.55){
      const m=tones[4+Math.floor(Math.random()*4)]+12*(Math.random()<.3?1:0);
      voice('sine',mtof(m),t,1.7,.05,{a:.01,bus:MB,verb:1,dly:1});
    }
  } else if(inten===1){
    if(step%2===0&&Math.random()<.55)mPluck(tones[(step>>1)%8],t,.045);
  } else if(inten===2){
    if(step%2===0)mPluck(tones[(step>>1)%8],t,.05);
    else if(step%4===3&&Math.random()<.4)mPluck(tones[(step*3)%8],t,.03);
  } else {
    if(step%2===0||Math.random()<.55)mPluck(tones[(step*3)%8],t,step%2===0?.052:.034);
  }

  /* percussion */
  if(inten>=2){
    if(step%2===1)noise(t,.035,.028,{type:'highpass',f0:7500,a:.001,bus:MB});
    if(p===14)noise(t,.18,.026,{type:'highpass',f0:7000,a:.002,bus:MB});
    const kick=inten>=3?(p%4===0):(p===0||p===8);
    if(kick){
      voice('sine',130,t,.2,.32,{to:42,glide:.1,a:.001,bus:MB});
      padBus.gain.cancelScheduledValues(t);
      padBus.gain.setValueAtTime(.55,t);padBus.gain.linearRampToValueAtTime(1,t+.24);
    }
    if(inten>=3&&(p===4||p===12))noise(t,.13,.05,{f0:1900,q:.8,a:.002,bus:MB,verb:1});
  }
}

/* ---------- glow sprites, trails, orbs ---------- */
const glowCache={};
function glowSprite(h){
  h=((Math.round(h/8)*8)%360+360)%360;
  let c=glowCache[h];
  if(!c){
    c=document.createElement('canvas');c.width=c.height=64;
    const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,'hsla('+h+',100%,72%,.95)');gr.addColorStop(.35,'hsla('+h+',100%,60%,.34)');gr.addColorStop(1,'hsla('+h+',100%,50%,0)');
    g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache[h]=c;
  }
  return c;
}
function drawGlow(c,x,y,r,h,a){c.globalAlpha=a;c.drawImage(glowSprite(h),x-r,y-r,r*2,r*2);c.globalAlpha=1;}

function tcol(id,i,t,hv,tm){
  switch(id){
    case 'fire':return 'hsl('+(8+t*45)+',100%,'+(46+t*14)+'%)';
    case 'rainbow':return 'hsl('+((i*14+tm*220)%360)+',100%,62%)';
    case 'stardust':return '#fff3b8';
    case 'plasma':return 'hsl('+(300-t*105)+',100%,'+(58+Math.sin(i*.6+tm*8)*9)+'%)';
    default:return 'hsl('+hv+',100%,'+(58+t*14)+'%)';
  }
}
function drawTrailPts(c,pts,id,hv,tm,wm){
  const n=pts.length;if(n<2)return;
  c.save();c.lineCap='round';c.lineJoin='round';c.globalCompositeOperation='lighter';
  if(id==='stardust')c.setLineDash([1.5*wm,9*wm]);
  for(let i=1;i<n;i++){
    const t=i/n;c.strokeStyle=tcol(id,i,t,hv,tm);
    c.globalAlpha=t*.2;c.lineWidth=(7+t*11)*wm;
    c.beginPath();c.moveTo(pts[i-1].x,pts[i-1].y);c.lineTo(pts[i].x,pts[i].y);c.stroke();
    c.globalAlpha=t*.92;c.lineWidth=(1.5+t*4.5)*wm;
    c.beginPath();c.moveTo(pts[i-1].x,pts[i-1].y);c.lineTo(pts[i].x,pts[i].y);c.stroke();
  }
  c.restore();
}
function drawOrb(c,skin,x,y,r,hv,tm){
  c.save();
  switch(skin){
    case 'ember':{
      const rr=r*(1+.1*Math.sin(tm*28));
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,rr*4.2,18,.9);c.globalCompositeOperation='source-over';
      const g=c.createRadialGradient(x,y,0,x,y,rr*1.2);g.addColorStop(0,'#fff8cf');g.addColorStop(.5,'#ff9a1a');g.addColorStop(1,'#ff3d00');
      c.fillStyle=g;c.beginPath();c.arc(x,y,rr*1.15,0,6.283);c.fill();break;}
    case 'halo':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*3.6,hv,.8);c.globalCompositeOperation='source-over';
      c.strokeStyle='#fff';c.lineWidth=Math.max(1.8,r*.34);c.beginPath();c.arc(x,y,r,0,6.283);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(x,y,r*.32,0,6.283);c.fill();break;}
    case 'gem':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*3.6,190,.75);c.globalCompositeOperation='source-over';
      c.translate(x,y);c.rotate(tm*1.2);const s=r*1.1;
      const g=c.createLinearGradient(-s,-s,s,s);g.addColorStop(0,'#fff');g.addColorStop(.5,'hsl(190,100%,70%)');g.addColorStop(1,'hsl(262,90%,66%)');
      c.fillStyle=g;c.beginPath();c.moveTo(0,-s*1.25);c.lineTo(s,0);c.lineTo(0,s*1.25);c.lineTo(-s,0);c.closePath();c.fill();
      c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=1.2;c.stroke();break;}
    case 'eclipse':{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*4.4,hv,.95);c.globalCompositeOperation='source-over';
      c.fillStyle='#04050b';c.beginPath();c.arc(x,y,r,0,6.283);c.fill();
      c.strokeStyle='hsl('+hv+',100%,78%)';c.lineWidth=Math.max(2,r*.3);c.stroke();break;}
    default:{
      c.globalCompositeOperation='lighter';drawGlow(c,x,y,r*4,hv,.85);c.globalCompositeOperation='source-over';
      const g=c.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfe0ff');
      c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();}
  }
  c.restore();
}

/* ---------- game state ---------- */
let state='home'; // home | play | pause | over
let rng=Math.random;
let anchors=[],items=[],wells=[],trail=[],parts=[],popups=[],rings=[],player=null,run={};
let MECH='',MODS={},AMB='star',stormT=0;
let time=0,camY=0,shake=0,slowT=0,flash=0,hue=232,hueT=232,overT=0;
const stars=[];for(let i=0;i<70;i++)stars.push({fx:Math.random(),fy:Math.random(),z:.03+Math.random()*.22,r:.6+Math.random()*1.6,tw:1+Math.random()*3,ph:Math.random()*6.28});

function windNow(){return Math.sin(time*.42)*95*(MODS.wind||0);}
function pulseOn(h){return Math.sin(time*2.4+h.ph)>-.2;}
function speed(){return 232+Math.min(run.score,60)*1.2+Math.min(46,((run.level||1)-1)*.8);}
function bestNow(){return save.lvl.bp[curLevel]||0;}
function bestIdxNow(){return save.lvl.bi[run.level]||0;}
/* consecutive days played */
function ymd(d){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function streakNow(){
  const y=new Date();y.setDate(y.getDate()-1);const t=dayKey(),l=save.streak.last;
  return (l===t||l===ymd(y))?save.streak.n:0;
}
function touchStreak(){
  const t=dayKey(),y=new Date();y.setDate(y.getDate()-1);
  if(save.streak.last===t)return;
  save.streak.n=save.streak.last===ymd(y)?save.streak.n+1:1;save.streak.last=t;
}
let runSeed=1;
function ensureDay(){
  const d=dayKey();
  if(save.missions.day!==d)save.missions={day:d,list:genMissions(d)};
}
function genMissions(d){
  const r=mulberry32(d*31+7),idx=MPOOL.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  return [0,1,2].map(t=>{const p=MPOOL[idx[t]];return{id:p.id,target:p.vals[t],rew:[30,60,100][t],prog:0,claimed:false};});
}
function mEvent(id,v){
  save.missions.list.forEach(m=>{
    if(m.id!==id||m.claimed)return;
    const p=MPOOL.find(x=>x.id===id);
    m.prog=p.max?Math.max(m.prog,v):m.prog+v;
  });
}

function newRun(soft){
  const D=levelDef(curLevel);
  runSeed=levelSeed(D.n);
  rng=mulberry32(runSeed);
  anchors=[];items=[];wells=[];parts=[];popups=[];rings=[];trail=[];
  MODS=D.mods;MECH=D.prim;AMB=ZONES[D.zi].amb;stormT=3;
  run={level:D.n,def:D,L:D.L,score:0,combo:0,maxIdx:0,chainIdx:0,lastChain:null,started:false,shards:0,shardTotal:0,perfects:0,bestCombo:0,revived:false,counted:false,
    bonusPaid:0,nb:false,pb:bestNow(),shield:false,surgeT:0,invuln:0,t:0,perfect:false,zone:D.w,streak:0,lastShard:-9,
    cleared:false,vanRun:0,helped:false,pat:{type:'free',left:0,dir:1,ph:0}};
  shake=0;slowT=0;flash=0;time=0;
  const a0={x:FW/2,bx:FW/2,y:0,idx:0,zn:D.w,haz:false,amp:0,ph:0,f:1,van:false,catchR:52,vt:0,gone:false,goal:false};
  anchors.push(a0);run.lastChain=a0;
  player={x:a0.x+60,y:a0.y,vx:0,vy:0,latched:a0,ang:0,dir:1,r:60,flightT:0,flyDist:0,prev:null,cool:0};
  camY=-H*0.62;
  const Z=zoneInfo(D.w);hue=hueT=Z.h;setBG(hue,!soft,Z.bg);setZoneFx(D.zi);prewarm(hue);
  /* the whole level is built up front, so it is finite, known and identical on every attempt */
  while(run.chainIdx<D.L)spawn();
  setAccent();hudScore(false);hudCoins();
}
function setAccent(){
  const z=zoneInfo(run.zone),h=z.h,r=document.documentElement.style;
  r.setProperty('--acc','hsl('+h+',90%,72%)');r.setProperty('--acc2','hsl('+((h+50)%360)+',85%,66%)');
  const hz=$('homeZone');if(hz)hz.textContent=zoneLabel(z);
}

/* each stretch of 3-5 anchors follows a layout pattern, so levels have rhythm instead of pure noise */
function pickPattern(D){
  const opts=['free','free'];
  if(D.n>=3)opts.push('zig','stair');
  if(D.n>=7)opts.push('wave');
  if(D.n>=9)opts.push('leap');
  const type=opts[Math.floor(rng()*opts.length)];
  return {type:type,left:3+Math.floor(rng()*3),dir:rng()<.5?-1:1,ph:rng()*6.28};
}
function segDist(px,py,ax,ay,bx,by){
  const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy||1;
  let t=((px-ax)*vx+(py-ay)*vy)/l2;t=clamp(t,0,1);
  return Math.hypot(px-(ax+vx*t),py-(ay+vy*t));
}

function spawn(){
  const D=run.def,M=MODS,i=++run.chainIdx,p=run.lastChain,goal=(i===D.L);
  if(run.pat.left<=0)run.pat=pickPattern(D);
  run.pat.left--;
  const P=run.pat;let dx,gm=1;
  switch(P.type){
    case 'zig':dx=(p.bx<FW/2?1:-1)*D.spread*(.7+rng()*.3);break;
    case 'stair':dx=P.dir*D.spread*(.45+rng()*.25);if(p.bx+dx<56||p.bx+dx>FW-56){P.dir=-P.dir;dx=-dx;}break;
    case 'wave':P.ph+=1.25;dx=Math.sin(P.ph)*D.spread;break;
    case 'leap':dx=(rng()*2-1)*D.spread*.3;gm=1.22;break;
    default:dx=(rng()*2-1)*D.spread;
  }
  /* never ask for a jump the orb cannot reasonably make */
  let gap=Math.min(262,D.gap*gm*(.86+rng()*.28)*(goal?.92:1));
  if(p.amp)gap=Math.min(gap,200);                            /* hops that start on a swinging anchor stay short */
  const maxDx=Math.sqrt(Math.max(0,(p.amp?215:300)*(p.amp?215:300)-gap*gap));
  dx=clamp(dx,-maxDx,maxDx);
  const x=clamp(p.bx+dx,50,FW-50);
  const a={x:x,bx:x,y:p.y-gap,idx:i,zn:run.zone,haz:false,amp:0,ph:rng()*6.28,f:1+rng()*.8,van:false,catchR:goal?58:52,vt:0,gone:false,goal:goal,mile:goal&&D.mile};
  /* swinging anchors */
  if(!goal&&i>=3){
    let ampP=D.ampP;if(M.drift)ampP=Math.max(ampP,.6*M.drift);
    /* two swinging anchors in a row are only allowed on short hops: leading a moving target over a long flight is not a fair ask */
    const hop=Math.hypot(a.bx-p.bx,gap);
    if(ampP>0&&rng()<ampP&&hop<=(p.amp?170:215)){a.amp=35+rng()*35;a.bx=clamp(x,50+a.amp,FW-50-a.amp);a.x=a.bx;}
  }
  /* crumbling anchors: never more than two in a row, and not on a swinging anchor until the later levels */
  if(!goal&&i>=2){
    let vanP=D.vanP;if(M.crumble)vanP=Math.max(vanP,.42*M.crumble);if(M.horizon)vanP=Math.max(vanP,.3*M.horizon);
    if(vanP>0&&run.vanRun<2&&!(a.amp&&D.n<30)&&rng()<vanP)a.van=true;
  }
  run.vanRun=a.van?run.vanRun+1:0;
  anchors.push(a);run.lastChain=a;

  const gapObjs=[];
  /* shards along the flight path */
  if(rng()<.62){
    const n=1+Math.floor(rng()*3);
    for(let k=0;k<n;k++){
      const t=.34+.32*(n===1?.5:k/(n-1));
      items.push({k:'s',x:p.bx+(a.bx-p.bx)*t,y:p.y+(a.y-p.y)*t,got:0});
    }
    run.shardTotal+=n;
  }
  /* power-ups; from level 5 every level also hands out one shield around the middle */
  let pty=null;
  if(!goal&&i>=5&&rng()<.08)pty=rng()<.5?'shield':'surge';
  else if(!goal&&!run.helped&&D.n>=5&&i===Math.max(5,Math.floor(D.L*.55)))pty='shield';
  if(pty){
    if(pty==='shield')run.helped=true;
    const side=rng()<.5?-1:1,pu={k:'p',type:pty,x:clamp((p.bx+a.bx)/2+side*62,30,FW-30),y:(p.y+a.y)/2,got:0};
    items.push(pu);gapObjs.push(pu);
  }
  /* gravity wells sit beside the flight path and bend the orb toward them */
  let wellSide=0;
  const wp=Math.max((M.well||0)*.55,(M.horizon||0)*.45);
  if(!goal&&wp>0&&rng()<wp){
    const side=rng()<.5?-1:1;wellSide=side;
    wells.push({x:clamp((p.bx+a.bx)/2+side*(78+rng()*26),60,FW-60),y:(p.y+a.y)/2+(rng()*26-13),r:M.horizon?132:112});
  }
  /* Hazards are placed relative to the flight path and never closer than the safe distance to either anchor,
     so a clean line to the next anchor always exists, and an orb orbiting an anchor can never touch one. */
  function placeHaz(side0,mv){
    const ha=mv?30:0,clear=64+ha+(M.wind?42*M.wind:0);
    const vx=a.bx-p.bx,vy=a.y-p.y,len=Math.hypot(vx,vy)||1,nx=-vy/len,ny=vx/len;
    const s0=side0||(rng()<.5?-1:1);
    for(let k=0;k<8;k++){
      const side=k%2?-s0:s0,t=.3+rng()*.4,off=clear+rng()*52;
      const hx=p.bx+vx*t+nx*side*off,hy=p.y+vy*t+ny*side*off;
      if(hx<(mv?60:30)||hx>FW-(mv?60:30))continue;
      if(segDist(hx,hy,p.bx,p.y,a.bx,a.y)<clear-2)continue;
      if(Math.hypot(hx-p.bx,hy-p.y)-ha-p.amp<80)continue;
      if(Math.hypot(hx-a.bx,hy-a.y)-ha-a.amp<80)continue;
      let bad=false;
      for(let j=anchors.length-1;j>=Math.max(0,anchors.length-10);j--){const o=anchors[j];if(o.haz&&Math.hypot(hx-o.bx,hy-o.y)<70+ha+o.amp){bad=true;break;}}
      for(let j=0;j<gapObjs.length&&!bad;j++){if(Math.hypot(hx-gapObjs[j].x,hy-gapObjs[j].y)<56+ha)bad=true;}
      if(bad)continue;
      anchors.push({x:hx,bx:hx,y:hy,idx:-1,zn:run.zone,haz:true,amp:ha,ph:rng()*6,f:1.2,van:false,catchR:0,vt:0,gone:false,near:false,pulse:!!M.pulse,goal:false});
      return side;
    }
    return 0;
  }
  if(i>=D.hazFrom){
    const hp=D.hazP+(M.pulse?.2*M.pulse:0);
    if(rng()<hp){
      const mv=D.hazMv>0&&rng()<D.hazMv;
      const s=placeHaz(wellSide?-wellSide:0,mv);
      if(s&&D.pairP>0&&rng()<D.pairP)placeHaz(-s,mv);
    }
  }
}

function burst(x,y,n,col,spd){
  if(parts.length>(lite?24:renderScale<.85?60:110))return;
  for(let i=0;i<n;i++){
    const an=Math.random()*6.283,v=(.3+Math.random())*(spd||120);
    parts.push({x:x,y:y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:.5+Math.random()*.4,max:.9,col:col});
  }
}
function ring(x,y,h,max){rings.push({x:x,y:y,r:6,max:max||80,t:0,h:h});}

function aimInfo(dx,dy){
  const p=player;let tgt=null;
  for(const a of anchors){if(a.haz||a.gone||a.idx<=run.maxIdx)continue;if(!tgt||a.idx<tgt.idx)tgt=a;}
  if(!tgt)return{ok:false};
  const tx=tgt.x-p.x,ty=tgt.y-p.y,along=tx*dx+ty*dy,perp=Math.abs(tx*dy-ty*dx);
  return{ok:along>20&&perp<15,tgt:tgt,along:along};
}

function release(auto){
  const p=player,a=p.latched;if(!a)return;
  const v=speed(),dx=-Math.sin(p.ang)*p.dir,dy=Math.cos(p.ang)*p.dir;
  if(!auto){
    const info=aimInfo(dx,dy);
    run.perfect=!!info.ok;
    if(info.ok){
      run.perfects++;save.stats.perfects++;mEvent('perfect',1);
      ring(p.x,p.y,48,70);sfx.perfect();
      popups.push({x:p.x,y:p.y-26,t:0,txt:'Perfect',sub:'',h:48});vib(12);
    }
  }
  p.vx=dx*v;p.vy=dy*v;
  p.prev=a;p.cool=.35;p.latched=null;p.flightT=0;p.flyDist=0;run.started=true;
  if(auto)a.gone=true;
  sfx.release();
  burst(p.x,p.y,6,'hsl('+hue+',100%,75%)',70);
  $('hint').classList.add('hide');fadeBanner();
}

function latch(a,d,dx,dy){
  const p=player;
  const cross=dx*p.vy-dy*p.vx;p.dir=cross>=0?1:-1;
  p.r=clamp(d,32,a.catchR);p.ang=Math.atan2(dy,dx);p.latched=a;a.vt=0;
  if(a.idx>run.maxIdx){
    const n=a.idx-run.maxIdx;
    const quick=n===1&&p.flightT<1.0;
    run.combo=quick?run.combo+1:0;
    if(run.combo>run.bestCombo){run.bestCombo=run.combo;if(run.combo>save.stats.bestCombo)save.stats.bestCombo=run.combo;mEvent('combo',run.combo);}
    run.maxIdx=a.idx;
    let pts=n+Math.min(3,Math.floor(run.combo/3))+(run.perfect?2:0);
    if(run.surgeT>0)pts*=2;
    run.score+=pts;save.stats.latches++;
    let sub='';if(n>1)sub='Skip x'+n;else if(run.combo>=2)sub='x'+run.combo;
    popups.push({x:a.x,y:a.y-34,t:0,txt:'+'+pts,sub:sub,h:hue});
    burst(a.x,a.y,12+Math.min(run.combo,8)*2,'hsl('+hue+',100%,70%)',150);
    ring(a.x,a.y,hue,70);
    sfx.latch(run.combo);
    if(save.set.shake)shake=Math.max(shake,2+Math.min(run.combo,6));
    vib(8);hudScore(true);
    if(!run.nb){
      const goal=run.pb;
      if(goal>0&&run.score>goal){
        run.nb=true;sfx.newBest();vib([20,30,40]);
        popups.push({x:player.x,y:player.y-70,t:0,txt:'New best',sub:'',h:46});
        burst(player.x,player.y,30,'#ffd36b',220);ring(player.x,player.y,46,120);
      }
    }
    if(a.goal)levelClear(a);
  } else {
    sfx.latchSoft();
  }
  run.perfect=false;
}
/* level title card: slides in, holds, fades (CSS only). The first visit to a world also pays its discovery reward. */
function announceLevel(){
  const D=run.def,z=zoneInfo(D.w);
  mEvent('zone',D.w+1);
  let rw=0;
  if(!save.disc[D.w]){save.disc[D.w]=1;rw=D.w<ZREW.length?ZREW[D.w]:zoneReward(D.w);save.coins+=rw;hudCoins();persist();}
  if(rw)setTimeout(function(){sfx.ach();},420);
  /* The title card appears only when it means something (the first level of a zone, or a milestone) and holds just two short lines. */
  if(D.k!==0&&!D.mile){hideBanner();return false;}
  const b=$('zbn'),t=$('zbT');
  $('zbS').style.display='none';$('zbR').style.display='none';
  if(D.mile){$('zbN').textContent='Level '+D.n;t.textContent='Milestone';t.style.fontSize='';}
  else{$('zbN').textContent='Zone '+(D.w+1);t.textContent=z.n;t.style.fontSize=z.n.length>12?'15px':(z.n.length>9?'17px':'');}
  b.style.setProperty('--zc','hsl('+z.h+',90%,72%)');
  b.classList.remove('show','bye');void b.offsetWidth;b.classList.add('show');
  return true;
}
function setZoneFx(zi){const f=document.getElementById('fxl');if(f)f.setAttribute('data-z',zi);}

function collect(it){
  if(it.k==='s'){
    if(time-run.lastShard>.7)run.streak=0;
    run.lastShard=time;run.streak++;
    run.shards++;save.coins++;save.stats.shards++;mEvent('shards',1);
    burst(it.x,it.y,5,'#ffd166',90);
    sfx.shard(run.streak);
    hudCoins();
  } else {
    const info=PU[it.type];
    save.stats.powerups++;mEvent('power',1);
    if(it.type==='shield')run.shield=true;
    if(it.type==='surge')run.surgeT=10;
    burst(it.x,it.y,16,'hsl('+info.h+',100%,70%)',160);ring(it.x,it.y,info.h,70);
    popups.push({x:it.x,y:it.y-26,t:0,txt:info.t,sub:'',h:info.h});
    sfx.power(it.type);vib(15);
  }
}

function rescue(){
  const p=player;let best=null,bd=1e9;
  for(const a of anchors){
    if(a.haz||a.gone||a.goal||a.y>camY+H*0.9)continue;
    const d=Math.abs(a.y-p.y)+Math.abs(a.x-p.x)*.3;
    if(d<bd){bd=d;best=a;}
  }
  if(!best)return false;
  p.latched=best;p.r=52;p.ang=Math.PI/2;p.dir=1;p.vx=p.vy=0;p.prev=null;p.cool=0;p.flightT=0;
  p.x=best.x+Math.cos(p.ang)*p.r;p.y=best.y+Math.sin(p.ang)*p.r;
  camY=Math.min(camY,p.y-H*0.55);trail=[];
  run.invuln=1.4;run.combo=0;
  return true;
}

(function(){const b=document.getElementById('zbn');if(b)b.addEventListener('animationend',function(e){if(e.animationName==='zbIn')b.classList.remove('show');});})();
function hideBanner(){const b=$('zbn');if(b)b.classList.remove('show','bye');}
function fadeBanner(){const b=$('zbn');if(b&&b.classList.contains('show')){b.classList.remove('show');b.classList.add('bye');}}
function finishRunStats(){
  if(run.score>save.bestAll)save.bestAll=run.score;
  if(!run.counted){run.counted=true;touchStreak();save.stats.runs++;Ads.since++;mEvent('runs',1);}
}
function die(why){
  if(state!=='play'||run.invuln>0)return;
  if(why==='hole'&&run.shield&&rescue()){run.shield=false;ring(player.x,player.y,195,100);popups.push({x:player.x,y:player.y-30,t:0,txt:'Shield saved you',sub:'',h:195});sfx.shieldSave();return;}
  state='over';overT=0;hideBanner();
  const p=player;
  burst(p.x,p.y,46,'#ff6b8a',280);ring(p.x,p.y,350,100);
  flash=.55;if(save.set.shake)shake=14;
  sfx.die();vib([30,40,60]);
  finishRunStats();
  mEvent('score',run.score);
  const bonus=Math.floor(run.score/3)-run.bonusPaid;run.bonusPaid+=bonus;save.coins+=bonus;
  /* remember how far this level was reached, so the next attempt shows a marker there */
  const lv=save.lvl;if(run.maxIdx>(lv.bi[run.level]||0)&&!lv.stars[run.level])lv.bi[run.level]=run.maxIdx;
  persist();
  fillOver();
  $('hud').classList.add('hide');
  if(!run.revived&&run.score>=5)openRev();else $('over').classList.remove('hide');
  hudCoins();
}

/* reaching the gate: stars are three independent goals (clear it, collect 40% of the shards, land perfect releases on half the anchors without reviving) */
function levelClear(a){
  if(state!=='play')return;
  state='clear';overT=-.6;run.cleared=true;hideBanner();
  const D=run.def,lv=save.lvl,n=run.level,par=perfOf(D);

  sync(){

    try{if(this.has()&&window.AndroidAds.setPlaying)window.AndroidAds.setPlaying(b);}catch(e){}
  },
  has(){return typeof window.AndroidAds!=='undefined'&&window.AndroidAds!==null;},
  rewardedReady(){try{return this.has()&&!this.busy&&!!window.AndroidAds.hasRewarded();}catch(e){return false;}},
  showRewarded(done){

/* ---------- update ---------- */
function update(dt,real){
  time+=dt;
  hue+=((hueT-hue+540)%360-180)*Math.min(1,dt*1.5);
  for(const a of anchors){if(a.amp&&!a.gone)a.x=a.bx+Math.sin(time*a.f+a.ph)*a.amp;}
  const p=player;
  if(state==='over'){overT+=real;tickRevive(real);}
  else if(state==='clear')overT+=real;
  if(state==='ready'){
    /* short "get ready" countdown after a revive, so the game can settle after an ad */
    run.rdy-=real;const n=Math.ceil(run.rdy/.9);
    if(n<=0){state='play';$('rdy').classList.add('hide');sfx.start();}
    else if($('rdyN').textContent!==''+n){$('rdyN').textContent=n;sfx.tick();}
  }

  if(state==='play'||state==='home'||state==='clear'){
    if(p.latched){
      const a=p.latched;
      p.ang+=p.dir*(speed()/p.r)*dt;
      p.x=a.x+Math.cos(p.ang)*p.r;p.y=a.y+Math.sin(p.ang)*p.r;
      if(state==='play'&&a.van){a.vt+=dt;if(a.vt>1.7)release(true);}
    } else if(state==='play'){
      /* zone forces on the flying orb */
      for(let i=0;i<wells.length;i++){
        const w=wells[i],wx=w.x-p.x,wy=w.y-p.y,d2=wx*wx+wy*wy;
        if(d2<w.r*w.r&&d2>36){const d=Math.sqrt(d2),k=1-d/w.r;p.vx+=wx/d*k*520*dt;p.vy+=wy/d*k*520*dt;}
      }
      if(MODS.wind)p.vx+=windNow()*dt;
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.flightT+=dt;p.flyDist+=Math.hypot(p.vx,p.vy)*dt;
      if(p.cool>0)p.cool-=dt;
      for(const a of anchors){
        if(a.gone)continue;
        const dx=p.x-a.x,dy=p.y-a.y,d=Math.hypot(dx,dy);
        if(a.haz){
          if(run.invuln>0)continue;
          if(a.pulse&&!pulseOn(a))continue;
          if(d<17){
            if(run.shield){
              run.shield=false;a.gone=true;run.invuln=.6;slowT=.25;
              burst(a.x,a.y,24,'#7fe3ff',200);ring(a.x,a.y,195,90);
              popups.push({x:a.x,y:a.y-28,t:0,txt:'Shield broke',sub:'',h:195});sfx.shieldBreak();vib(25);
              continue;
            }
            die('hazard');break;
          }
          if(d<46&&!a.near){a.near=true;slowT=.4;if(save.set.shake)shake=Math.max(shake,5);sfx.near();popups.push({x:a.x,y:a.y-26,t:0,txt:'Close call',sub:'',h:350});}
        } else if(d<a.catchR&&!(a===p.prev&&p.cool>0)){
          latch(a,d,dx,dy);break;
        }
      }
    }
  }

  if(state==='play'){
    run.t+=dt;save.stats.time+=dt;
    if(run.invuln>0)run.invuln-=dt;
    if(run.surgeT>0)run.surgeT-=dt;
    for(const it of items){
      if(it.got)continue;
      const dx=p.x-it.x,dy=p.y-it.y,d=Math.hypot(dx,dy);
      if(d<(it.k==='s'?22:28)){it.got=1;collect(it);}
    }
    if(run.started)camY-=(run.def.scroll+Math.min(run.score,60)*.35)*dt;
    const target=p.y-H*0.6;
    if(target<camY)camY+=(target-camY)*Math.min(1,dt*5);
    if(!p.latched&&p.flyDist>FLY_MAX&&run.invuln<=0&&!run.shield)popups.push({x:p.x,y:p.y-26,t:0,txt:'Lost in space',sub:'',h:350});
    if(p.y-camY>H+30||p.x<-90||p.x>FW+90||(!p.latched&&p.flyDist>FLY_MAX))die('hole');
    updChips();
  }

  /* drop everything the player has left behind, in place (no new arrays every frame) */
  {let w=0;const lim=camY+H+350,pl=state==='play';
   for(let i=0;i<anchors.length;i++){const a=anchors[i];if(a.y<lim&&!(a.gone&&pl))anchors[w++]=a;}anchors.length=w;}
  {let w=0;const lim=camY+H+300;
   for(let i=0;i<items.length;i++){const it=items[i];if(!it.got&&it.y<lim)items[w++]=it;}items.length=w;
   w=0;for(let i=0;i<wells.length;i++){if(wells[i].y<lim+60)wells[w++]=wells[i];}wells.length=w;}
  if(MODS.pulse&&state==='play'){stormT-=real;if(stormT<=0){stormT=3+Math.random()*4;const f=document.getElementById('fxs');if(f){f.classList.remove('on');void f.offsetWidth;f.classList.add('on');}if(save.set.shake)shake=Math.max(shake,3);}}
  if(p.latched&&!anchors.includes(p.latched))p.latched=null;

  if(state!=='over'){trail.push({x:p.x,y:p.y});if(trail.length>36)trail.shift();}
  else if(trail.length)trail.shift();

  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.97;q.vy*=.97;q.life-=dt;
    if(q.life<=0){parts[i]=parts[parts.length-1];parts.pop();}
  }
  for(let i=popups.length-1;i>=0;i--){const q=popups[i];q.t+=dt;q.y-=28*dt;if(q.t>.9)popups.splice(i,1);}
  for(let i=rings.length-1;i>=0;i--){const q=rings[i];q.t+=dt;q.r=6+(q.max-6)*Math.min(1,q.t/.5);if(q.t>.5)rings.splice(i,1);}
  shake*=Math.pow(.02,real);if(shake<.1)shake=0;
  flash=Math.max(0,flash-real*2);
}

/* ---------- cached sprites: each is drawn once per colour and reused every frame ---------- */
const spriteCache=new Map();
function qh(h,st){return (((Math.round(h/st)*st)%360)+360)%360;}
function getSprite(kind,h){
  const key=kind*1000+h;let c=spriteCache.get(key);if(c)return c;
  if(spriteCache.size>500)spriteCache.clear();
  c=document.createElement('canvas');const g=c.getContext('2d');
  if(kind===1){            /* anchor core */
    c.width=c.height=72;g.scale(3,3);g.translate(12,12);
    const gr=g.createRadialGradient(-2,-2,1,0,0,9);gr.addColorStop(0,'#fff');gr.addColorStop(1,'hsl('+h+',90%,62%)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,8.5,0,6.283);g.fill();
  } else if(kind===2){     /* dashed catch ring, radius 52 */
    c.width=c.height=224;g.scale(2,2);g.translate(56,56);
    g.strokeStyle='hsl('+h+',90%,74%)';g.lineWidth=1.3;g.setLineDash([3,7]);g.beginPath();g.arc(0,0,52,0,6.283);g.stroke();
  } else if(kind===3){     /* soft background glow */
    c.width=c.height=128;
    const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'hsla('+h+',80%,45%,.16)');gr.addColorStop(1,'hsla('+h+',80%,45%,0)');
    g.fillStyle=gr;g.fillRect(0,0,128,128);
  } else if(kind===4){     /* background colour strip, stretched over the screen */
    c.width=2;c.height=128;
    const gr=g.createLinearGradient(0,0,0,128);gr.addColorStop(0,'hsl('+h+',55%,5%)');gr.addColorStop(1,'hsl('+((h+28)%360)+',55%,15%)');
    g.fillStyle=gr;g.fillRect(0,0,2,128);
  } else if(kind===6){     /* tinted ambient dot (embers, snow) */
    c.width=c.height=16;g.fillStyle='hsl('+h+',100%,74%)';g.beginPath();g.arc(8,8,7,0,6.283);g.fill();
  } else if(kind===7){     /* gravity well */
    c.width=c.height=128;
    const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,6,.92)');gr.addColorStop(.42,'rgba(2,2,12,.62)');gr.addColorStop(.8,'hsla('+h+',90%,60%,.16)');gr.addColorStop(1,'hsla('+h+',90%,60%,0)');

const bgl=document.getElementById('bgl');let bgQ=-1,bgOn=1,bgZ=1;
function setBG(h,instant,zi){
